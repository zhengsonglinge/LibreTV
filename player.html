                    liveDurationInfinity: false
                };

                resetPlayerQuality();

                // 清理之前的HLS实例
                if (currentHls && currentHls.destroy) {
                    try {
                        currentHls.destroy();
                    } catch (e) {
                        console.warn('销毁旧HLS实例出错:', e);
                    }
                }
                
                // 创建新的HLS实例
                const hls = new Hls(hlsConfig);
                currentHls = hls;
                
                // 跟踪是否已经显示错误
                let errorDisplayed = false;
                // 跟踪视频是否开始播放
                let playbackStarted = false;
                // 跟踪视频是否出现bufferAppendError
                let bufferAppendErrorCount = 0;
                // 限制启动阶段的自动恢复次数，避免源失效时无限重试
                let networkRecoveryCount = 0;
                let mediaRecoveryCount = 0;
                let nativeFallbackAttempted = false;
                let playbackNoticeCleanupTimer = null;
                // 已经彻底放弃这次播放（防止后续迟到的事件重复报错/重复销毁）
                let playbackFailed = false;

                function clearStalePlaybackNotice() {
                    clearPlayerNotice();
                }

                // 统一的视频事件监听管理：每次换源都会重新绑定，必须能解绑，
                // 否则连看几十集后回调不断累积，越看越卡
                const videoListeners = [];
                function addVideoListener(type, handler) {
                    video.addEventListener(type, handler);
                    videoListeners.push([type, handler]);
                }
                function removeVideoListeners() {
                    while (videoListeners.length) {
                        const entry = videoListeners.pop();
                        video.removeEventListener(entry[0], entry[1]);
                    }
                    if (playbackNoticeCleanupTimer) {
                        clearTimeout(playbackNoticeCleanupTimer);
                        playbackNoticeCleanupTimer = null;
                    }
                }
                
                // 监听视频播放事件
                addVideoListener('playing', function() {
                    playbackStarted = true;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'none';
                    clearStalePlaybackNotice();
                    clearTimeout(playbackNoticeCleanupTimer);
                    playbackNoticeCleanupTimer = setTimeout(clearStalePlaybackNotice, 1200);
                });
                
                // 监听视频进度事件
                addVideoListener('timeupdate', function() {
                    if (video.currentTime > 1) {
                        // 视频进度超过1秒，隐藏错误（如果存在）
                        document.getElementById('error').style.display = 'none';
                        if (playbackNoticeCleanupTimer) {
                            clearTimeout(playbackNoticeCleanupTimer);
                            playbackNoticeCleanupTimer = null;
                            clearStalePlaybackNotice();
                        }
                    }
                });

                // Video.js 不会替我们写 video.src，直接使用传入的源地址
                const sourceUrl = initialUrl;
                if (!/^https?:\/\//i.test(sourceUrl)) {
                    showError('播放地址无效，请重新选择片源或剧集');
                    removeVideoListeners();
                    hls.destroy();
                    currentHls = null;
                    // 仍要返回 dispose，否则 Video.js 无法回收这个 source handler
                    return { dispose: function() {} };
                }

                hls.attachMedia(video);
                hls.loadSource(sourceUrl);
                
                // enable airplay, from https://github.com/video-dev/hls.js/issues/5989
                video.disableRemotePlayback = false;

                function tryNativeHlsFallback() {
                    if (nativeFallbackAttempted || !supportsNativeHlsPlayback()) {
                        return false;
                    }

                    nativeFallbackAttempted = true;
                    const fallbackUrl = hls.url || initialUrl;
                    console.warn('Hls.js 播放失败，尝试切换为设备原生 HLS:', fallbackUrl);

                    try {
                        hls.destroy();
                        if (currentHls === hls) {
                            currentHls = null;
                        }

                        video.pause();
                        video.removeAttribute('src');
                        video.src = fallbackUrl;
                        video.load();
                        video.disableRemotePlayback = false;

                        currentPlaybackEngine = 'native-hls';
                        resetPlayerQuality();
                        setPlayerPlaybackEngine('native-hls');
                        showLoadingLayer('正在切换为设备原生播放…');

                        const playPromise = video.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(error => {
                                if (!handleBlockedPlayback(error)) {
                                    console.warn('原生 HLS 自动播放失败:', error);
                                }
                            });
                        }
                        showToast('已自动切换为设备原生播放', 'success');
                        return true;
                    } catch (error) {
                        console.error('切换设备原生 HLS 失败:', error);
                        return false;
                    }
                }
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    syncPlayerQuality(hls, video);
                    video.play().catch(e => {
                        if (!handleBlockedPlayback(e)) {
                            console.warn('自动播放失败:', e);
                        }
                    });
                });

                hls.on(Hls.Events.LEVEL_SWITCHED, function() {
                    syncPlayerQuality(hls, video);
                });

                addVideoListener('loadedmetadata', function() {
                    syncPlayerQuality(hls, video);
                });
                
                // 恢复次数上限：启动阶段宽松一点，播放中更克制，避免死源反复重试
                function getRecoveryLimits() {
                    return playbackStarted
                        ? { network: 3, media: 3 }
                        : { network: 2, media: 2 };
                }

                // 彻底播不下去了：显示错误并停掉当前 HLS 实例
                function failPlayback(message) {
                    if (playbackFailed) return;
                    playbackFailed = true;

                    showError(message, { force: true });
                    try {
                        // 先暂停再销毁：避免残留的 timeupdate 把刚显示的错误蒙层又隐藏掉
                        video.pause();
                        hls.destroy();
                    } catch (error) {
                        console.warn('销毁失败的HLS实例出错:', error);
                    }
                    if (currentHls === hls) {
                        currentHls = null;
                    }
                }

                hls.on(Hls.Events.ERROR, function(event, data) {
                    // 非致命错误交给 hls.js 内部处理，不再逐条打印全量日志：
                    // bufferStalledError 每次卡顿都会触发，序列化 data 会拖慢主线程
                    if (!data.fatal) {
                        if (data.details === 'bufferAppendError') {
                            bufferAppendErrorCount++;
                            console.warn(`bufferAppendError 发生 ${bufferAppendErrorCount} 次`);
                            // 播放中忽略；启动阶段连续失败时尝试恢复解码器
                            if (!playbackStarted && bufferAppendErrorCount >= 3) {
                                hls.recoverMediaError();
                            }
                        }
                        return;
                    }

                    console.error('致命HLS错误:', data.type, data.details, data);

                    if (playbackFailed) return;

                    const responseCode = Number(data.response && data.response.code) || 0;

                    // ===== 启动阶段：源本身不可用就直接提示，不必反复重试 =====
                    if (!playbackStarted) {
                        if (responseCode >= 400) {
                            failPlayback(`片源不可用（HTTP ${responseCode}），请切换其他来源`);
                            return;
                        }

                        const manifestFailed = [
                            'manifestLoadError',
                            'manifestParsingError',
                            'levelLoadError',
                            'levelParsingError'
                        ].includes(data.details);

                        // 清单无法加载时不再无限重试，直接提示切换片源
                        if (manifestFailed) {
                            failPlayback('片源连接失败或格式无效，请切换其他来源');
                            return;
                        }

                        // 部分设备支持原生 HLS，先试一次原生播放兜底
                        if (!nativeFallbackAttempted && tryNativeHlsFallback()) {
                            return;
                        }
                    }

                    // ===== 启动阶段和播放中都适用的有限次恢复 =====
                    // 原来的判断是 data.fatal && !playbackStarted，
                    // 结果播到一半断网/分片失效/解码失败时一个分支都不进，
                    // 画面永久冻住且没有任何提示。这里去掉了 playbackStarted 限制。
                    const limits = getRecoveryLimits();

                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            if (networkRecoveryCount >= limits.network) {
                                failPlayback(playbackStarted
                                    ? '播放中断：片源网络连接失败，请切换其他来源'
                                    : '片源网络连接失败，请检查网络或切换其他来源');
                                return;
                            }
                            networkRecoveryCount++;
                            console.warn(`尝试恢复网络错误（${networkRecoveryCount}/${limits.network}）`);
                            // 播放中从当前位置重新拉流，避免继续消费已经失效的分片队列
                            if (playbackStarted && Number.isFinite(video.currentTime)) {
                                hls.startLoad(video.currentTime);
                            } else {
                                hls.startLoad();
                            }
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            if (mediaRecoveryCount >= limits.media) {
                                failPlayback(playbackStarted
                                    ? '播放中断：视频解码失败，请切换其他来源'
                                    : '视频解码失败，请切换其他来源');
                                return;
                            }
                            mediaRecoveryCount++;
                            console.warn(`尝试恢复媒体错误（${mediaRecoveryCount}/${limits.media}）`);
                            hls.recoverMediaError();
                            break;
                        default:
                            if (!errorDisplayed) {
                                errorDisplayed = true;
                                showError('视频加载失败，可能是格式不兼容或源不可用', {
                                    force: !playbackStarted
                                });
                            }
                            break;
                    }
                });
                
                // 监听分段加载事件
                hls.on(Hls.Events.FRAG_LOADED, function() {
                    document.getElementById('loading').style.display = 'none';
                });
                
                // 监听级别加载事件
                hls.on(Hls.Events.LEVEL_LOADED, function() {
                    document.getElementById('loading').style.display = 'none';
                });

                return {
                    dispose: function() {
                        removeVideoListeners();
                        if (currentHls === hls) {
                            currentHls = null;
                        }
                        try {
                            hls.destroy();
                        } catch (error) {
                            console.warn('销毁HLS实例出错:', error);
                        }
                        resetPlayerQuality();
                    }
                };
            }
        };

        if (typeof videojs !== 'undefined' && videojs.getTech('Html5')) {
            // 插到最前面，优先于内置的 VHS
            videojs.getTech('Html5').registerSourceHandler(LibreTvHlsSourceHandler, 0);
        }


        // ===== 分片缓存（IndexedDB + LRU）=====
        // 目的：把播放过的分片落盘，重看 / 回拖 / 网络抖动时直接命中，零额外带宽。
        // 只缓存 hls.js 请求过的内容，不主动下载，避免抢播放带宽和放大源站带宽成本。
        //
        // 重要：数据(ArrayBuffer)和元信息(size/lastAccess)必须分库存放。
        // 如果同库，重建 LRU 索引时 cursor.value 会把每条记录的 ArrayBuffer 一起反序列化，
        // 相当于每次打开播放页都要把整个缓存读进内存，起播直接卡死。
        const SEGMENT_CACHE_DB = 'libreTVSegmentCache';
        const SEGMENT_CACHE_VERSION = 2;
        const SEGMENT_CACHE_DATA_STORE = 'segments';   // key -> { key, data }
        const SEGMENT_CACHE_META_STORE = 'meta';       // key -> { key, size, lastAccess }
        const SEGMENT_CACHE_HARD_LIMIT = 1024 * 1024 * 1024; // 硬上限 1GB
        const SEGMENT_CACHE_FLOOR_LIMIT = 64 * 1024 * 1024;  // 下限 64MB
        const SEGMENT_CACHE_EVICT_TARGET = 0.8;              // 超限后回收到 80%
        const SEGMENT_CACHE_MAX_PENDING = 12;                // 写入队列上限，防止内存堆积
        const SEGMENT_CACHE_META_TOUCH_INTERVAL = 5000;      // 元信息回写最小间隔

        const segmentCache = (function () {
            let disabled = false;
            let dbPromise = null;
            let indexReady = Promise.resolve();
            let ready = false;   // 索引就绪前，读缓存不参与起播关键路径
            let limitsPromise = null;
            let limitBytes = SEGMENT_CACHE_HARD_LIMIT;
            let totalBytes = 0;
            let pendingWrites = 0;
            let writeQueue = Promise.resolve();
            let persistRequested = false;
            let lastMetaTouch = 0;
            const lru = new Map(); // key -> size，Map 的插入顺序即 LRU 顺序（前面最旧）

            function isEnabled() {
                if (disabled) return false;
                if (typeof indexedDB === 'undefined') return false;
                try {
                    // 留一个后门方便排查：localStorage.segmentCacheEnabled = 'false'
                    if (localStorage.getItem('segmentCacheEnabled') === 'false') return false;
                } catch (error) {
                    // 忽略隐私模式下的访问异常
                }
                return true;
            }

            // 第一次真正写缓存时才申请持久化，避免"打开播放页就弹授权"
            function requestPersist() {
                if (persistRequested) return;
                persistRequested = true;
                try {
                    if (navigator.storage && typeof navigator.storage.persist === 'function') {
                        navigator.storage.persist().catch(function () {});
                    }
                } catch (error) {
                    // 忽略
                }
            }

            // 按实际配额算缓存上限（配额的 30%，夹在 64MB ~ 1GB 之间）
            function resolveLimits() {
                if (limitsPromise) return limitsPromise;
                limitsPromise = new Promise(function (resolve) {
                    try {
                        if (navigator.storage && typeof navigator.storage.estimate === 'function') {
                            navigator.storage.estimate().then(function (estimate) {
                                const quota = Number(estimate && estimate.quota) || 0;
                                if (quota > 0) {
                                    limitBytes = Math.min(
                                        SEGMENT_CACHE_HARD_LIMIT,
                                        Math.max(SEGMENT_CACHE_FLOOR_LIMIT, Math.floor(quota * 0.3))
                                    );
                                }
                            }).catch(function () {}).then(resolve, resolve);
                        } else {
                            resolve();
                        }
                    } catch (error) {
                        resolve();
                    }
                });
                return limitsPromise;
            }

            function open() {
                if (dbPromise) return dbPromise;

                dbPromise = new Promise(function (resolve) {
                    if (!isEnabled()) {
                        resolve(null);
                        return;
                    }
                    let request;
                    try {
                        request = indexedDB.open(SEGMENT_CACHE_DB, SEGMENT_CACHE_VERSION);
                    } catch (error) {
                        console.warn('分片缓存不可用，已关闭:', error);
                        disabled = true;
                        resolve(null);
                        return;
                    }

                    request.onupgradeneeded = function () {
                        const db = request.result;
                        // v1 把数据和元信息放在同一个库，重建索引会读出整个缓存，直接丢弃重建
                        if (db.objectStoreNames.contains(SEGMENT_CACHE_DATA_STORE)) {
                            db.deleteObjectStore(SEGMENT_CACHE_DATA_STORE);
                        }
                        if (db.objectStoreNames.contains(SEGMENT_CACHE_META_STORE)) {
                            db.deleteObjectStore(SEGMENT_CACHE_META_STORE);
                        }
                        db.createObjectStore(SEGMENT_CACHE_DATA_STORE, { keyPath: 'key' });
                        db.createObjectStore(SEGMENT_CACHE_META_STORE, { keyPath: 'key' })
                            .createIndex('lastAccess', 'lastAccess');
                    };
                    request.onsuccess = function () {
                        const db = request.result;
                        db.onversionchange = function () {
                            try { db.close(); } catch (error) {}
                        };
                        resolve(db);
                        indexReady = buildIndex(db).then(
                            function () { ready = true; },
                            function () { ready = true; }
                        );
                    };
                    request.onerror = function () {
                        console.warn('分片缓存打开失败，已关闭');
                        disabled = true;
                        resolve(null);
                    };
                    request.onblocked = function () {
                        disabled = true;
                        resolve(null);
                    };
                });

                resolveLimits();
                return dbPromise;
            }

            // 从元信息库恢复 LRU 顺序和占用量（只读小记录，不碰分片数据）
            function buildIndex(db) {
                return new Promise(function (resolve) {
                    if (!db) {
                        resolve();
                        return;
                    }
                    try {
                        const tx = db.transaction(SEGMENT_CACHE_META_STORE, 'readonly');
                        const request = tx.objectStore(SEGMENT_CACHE_META_STORE).index('lastAccess').openCursor();
                        request.onsuccess = function () {
                            const cursor = request.result;
                            if (!cursor) return;
                            const record = cursor.value;
                            if (record && record.key) {
                                const size = Number(record.size) || 0;
                                lru.set(record.key, size);
                                totalBytes += size;
                            }
                            cursor.continue();
                        };
                        tx.oncomplete = function () {
                            evictIfNeeded(0).catch(function () {}).then(resolve, resolve);
                        };
                        tx.onerror = function () { resolve(); };
                        tx.onabort = function () { resolve(); };
                    } catch (error) {
                        resolve();
                    }
                });
            }

            // 打开数据库并等配额和索引都就绪
            function ensureReady() {
                return resolveLimits().then(open).then(function (db) {
                    if (!db) return null;
                    return indexReady.then(function () { return db; });
                });
            }

            function touch(key) {
                if (!lru.has(key)) return;
                const size = lru.get(key);
                lru.delete(key);
                lru.set(key, size);

                const now = Date.now();
                if (now - lastMetaTouch < SEGMENT_CACHE_META_TOUCH_INTERVAL) return;
                lastMetaTouch = now;
                // 低频把访问时间刷回元信息，保证刷新后 LRU 顺序仍接近真实
                open().then(function (db) {
                    if (!db) return;
                    try {
                        db.transaction(SEGMENT_CACHE_META_STORE, 'readwrite')
                            .objectStore(SEGMENT_CACHE_META_STORE)
                            .put({ key: key, size: size, lastAccess: now });
                    } catch (error) {
                        // 忽略
                    }
                }).catch(function () {});
            }

            function evictIfNeeded(incomingBytes) {
                if (totalBytes + incomingBytes <= limitBytes) return Promise.resolve();

                const target = limitBytes * SEGMENT_CACHE_EVICT_TARGET;
                const victims = [];
                for (const entry of lru) {
                    if (totalBytes + incomingBytes <= target) break;
                    victims.push(entry[0]);
                    totalBytes -= entry[1] || 0;
                    lru.delete(entry[0]);
                }
                if (victims.length === 0) return Promise.resolve();

                return ensureReady().then(function (db) {
                    if (!db) return;
                    return new Promise(function (resolve) {
                        try {
                            const tx = db.transaction(
                                [SEGMENT_CACHE_DATA_STORE, SEGMENT_CACHE_META_STORE],
                                'readwrite'
                            );
                            const dataStore = tx.objectStore(SEGMENT_CACHE_DATA_STORE);
                            const metaStore = tx.objectStore(SEGMENT_CACHE_META_STORE);
                            victims.forEach(function (key) {
                                dataStore.delete(key);
                                metaStore.delete(key);
                            });
                            tx.oncomplete = resolve;
                            tx.onerror = resolve;
                            tx.onabort = resolve;
                        } catch (error) {
                            resolve();
                        }
                    });
                });
            }

            function get(key) {
                if (!isEnabled()) return Promise.resolve(null);
                return ensureReady().then(function (db) {
                    if (!db) return null;
                    return new Promise(function (resolve) {
                        let request;
                        try {
                            request = db.transaction(SEGMENT_CACHE_DATA_STORE, 'readonly')
                                .objectStore(SEGMENT_CACHE_DATA_STORE)
                                .get(key);
                        } catch (error) {
                            resolve(null);
                            return;
                        }
                        request.onsuccess = function () {
                            const record = request.result;
                            if (!record || !record.data) {
                                resolve(null);
                                return;
                            }
                            touch(key);
                            resolve(record.data);
                        };
                        request.onerror = function () { resolve(null); };
                    });
                }).catch(function () { return null; });
            }

            function put(key, data, url) {
                if (!isEnabled()) return Promise.resolve();
                const size = Number(data && data.byteLength) || 0;
                if (size === 0) return Promise.resolve();
                // 单个分片超过配额的 1/8 就没必要缓存了
                if (size > limitBytes / 8) return Promise.resolve();
                if (pendingWrites >= SEGMENT_CACHE_MAX_PENDING) return Promise.resolve();

                requestPersist();
                pendingWrites += 1;
                writeQueue = ensureReady()
                    .then(function () { return evictIfNeeded(size); })
                    .then(function () { return open(); })
                    .then(function (db) {
                        if (!db) return;
                        return new Promise(function (resolve) {
                            let tx;
                            try {
                                tx = db.transaction(
                                    [SEGMENT_CACHE_DATA_STORE, SEGMENT_CACHE_META_STORE],
                                    'readwrite'
                                );
                                const lastAccess = Date.now();
                                tx.objectStore(SEGMENT_CACHE_DATA_STORE).put({ key: key, data: data });
                                tx.objectStore(SEGMENT_CACHE_META_STORE).put({
                                    key: key,
                                    size: size,
                                    lastAccess: lastAccess
                                });
                            } catch (error) {
                                resolve();
                                return;
                            }
                            tx.oncomplete = function () {
                                const previous = lru.get(key) || 0;
                                lru.delete(key);
                                lru.set(key, size);
                                totalBytes += size - previous;
                                resolve();
                            };
                            tx.onerror = function () { resolve(); };
                            tx.onabort = function () { resolve(); };
                        });
                    })
                    .catch(function (error) {
                        // 配额真的写不进去就整体关掉，避免每帧重试
                        if (error && /quota/i.test(String(error.name || error.message || ''))) {
                            console.warn('分片缓存配额不足，已关闭:', error);
                            disabled = true;
                        }
                    })
                    .then(function () {
                        pendingWrites -= 1;
                    });

                return writeQueue;
            }

            // 缓存 key：同一 URL 的不同 Range 必须区分开，
            // 否则 BYTERANGE 源（fMP4）会把不同片段互相覆盖
            function buildKey(context) {
                if (!context || !context.url) return '';
                const start = Number(context.rangeStart) || 0;
                const end = Number(context.rangeEnd) || 0;
                return end > 0 ? context.url + '|' + start + '-' + end : context.url + '|0';
            }

            // 伪造一份"看起来像正常下载"的计时统计。
            // 关键点：如果直接给 tload=0，ABR 会算出无穷大带宽并立刻跳到最高档，
            // 反而导致后续都要重新走网络而卡顿。这里按当前档位码率的 1.05 倍估算，
            // 低于 ABR 升档阈值（约 2 倍）、高于降档阈值，让档位保持稳定。
            function buildStats(data, levelBitrate) {
                const now = (typeof performance !== 'undefined' && performance.now)
                    ? performance.now()
                    : Date.now();
                const loaded = Number(data.byteLength) || 0;
                const bitrate = Number(levelBitrate) || 0;
                const bps = bitrate > 0 ? bitrate * 1.05 : 6 * 1000 * 1000;
                const loadMs = Math.min(8000, Math.max(40, (loaded * 8000) / bps));
                const ttfbMs = Math.min(120, Math.max(20, loadMs * 0.2));

                return {
                    aborted: false,
                    loaded: loaded,
                    retry: 0,
                    total: loaded,
                    chunkCount: 0,
                    bwEstimate: bps,
                    loading: {
                        start: now - loadMs - ttfbMs,
                        first: now - loadMs,
                        end: now - ttfbMs
                    },
                    parsing: { start: now - ttfbMs, end: now },
                    buffering: { start: 0, first: 0, end: 0 }
                };
            }

            function getLevelBitrate(context) {
                try {
                    const level = context && context.frag ? context.frag.level : -1;
                    const hls = currentHls;
                    if (hls && Array.isArray(hls.levels) && Number.isInteger(level) && hls.levels[level]) {
                        return Number(hls.levels[level].bitrate) || 0;
                    }
                } catch (error) {
                    // 忽略
                }
                return 0;
            }

            // 命中就回放缓存，没命中就走网络并顺手写缓存
            function serve(context, config, callbacks, networkLoad) {
                const key = buildKey(context);
                if (!key || !isEnabled()) {
                    networkLoad();
                    return;
                }

                const loadFromNetwork = function () {
                    const onSuccess = callbacks.onSuccess;
                    callbacks.onSuccess = function (response, stats, ctx, networkDetails) {
                        if (response && response.data && Number(response.data.byteLength) > 0) {
                            put(key, response.data, context.url);
                        }
                        return onSuccess(response, stats, ctx, networkDetails);
                    };
                    networkLoad();
                };

                // 索引还没建好（刚打开播放页）时不要在起播关键路径上等 IndexedDB，
                // 直接走网络；这次的分片照样会被存下来
                if (!ready) {
                    loadFromNetwork();
                    return;
                }

                get(key).then(function (data) {
                    if (!data || !Number(data.byteLength)) {
                        loadFromNetwork();
                        return;
                    }
                    try {
                        callbacks.onSuccess(
                            { url: context.url, data: data, code: 200 },
                            buildStats(data, getLevelBitrate(context)),
                            context
                        );
                    } catch (error) {
                        console.warn('读取分片缓存失败，回退到网络:', error);
                        loadFromNetwork();
                    }
                }).catch(function () {
                    loadFromNetwork();
                });
            }

            function stats() {
                return {
                    enabled: isEnabled(),
                    ready: ready,
                    entries: lru.size,
                    totalBytes: totalBytes,
                    limitBytes: limitBytes
                };
            }

            function statsAsync() {
                return ensureReady().then(stats, stats);
            }

            function warmup() {
                return ensureReady().catch(function () {});
            }

            return {
                warmup: warmup,
                serve: serve,
                stats: stats,
                statsAsync: statsAsync,
                get: get,
                put: put
            };
        })();

        // 便于在控制台排查：await getSegmentCacheStats()
        window.getSegmentCacheStats = function () { return segmentCache.statsAsync(); };

        // 页面加载时后台打开数据库并重建索引，等用户点播放时已经就绪
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () { segmentCache.warmup(); });
        } else {
            segmentCache.warmup();
        }

        // 自定义 Loader：清单做广告过滤，分片走 IndexedDB 缓存
        class CustomHlsJsLoader extends Hls.DefaultConfig.loader {
            constructor(config) {
                super(config);
                const load = this.load.bind(this);
                this.load = function(context, config, callbacks) {
                    // 1) 清单请求：按开关做广告过滤（不再依赖 loader 是否被启用）
                    if (adFilteringEnabled && context
                        && (context.type === 'manifest' || context.type === 'level')) {
                        const onSuccess = callbacks.onSuccess;
                        callbacks.onSuccess = function(response, stats, ctx, networkDetails) {
                            if (response && response.data && typeof response.data === 'string') {
                                response.data = filterAdsFromM3U8(response.data, true);
                            }
                            return onSuccess(response, stats, ctx, networkDetails);
                        };
                    }

                    // 2) 分片 / 初始化段 / 解密密钥（都是 arraybuffer）：先查缓存
                    if (context && context.frag && context.responseType === 'arraybuffer') {
                        segmentCache.serve(context, config, callbacks, function() {
                            load(context, config, callbacks);
                        });
                        return;
                    }

                    // 执行原始load方法
                    load(context, config, callbacks);
                };
            }
        }

        // ===== M3U8 清单广告过滤 =====
        // 原则：只丢弃明确的广告分片，绝不删除任何 #EXT 标签
        // 判断某个分片地址是否明显是广告：只看路径最后两段的名字，
        // 且必须是完整的 ad / ads / adv / advert 这类词，避免误伤 1000k、seg-1 这类正常分片
        function isAdSegmentUrl(rawUrl) {
            if (!rawUrl) return false;
            try {
                const parsed = new URL(rawUrl, 'https://placeholder.invalid/');
                const segments = parsed.pathname.split('/').filter(Boolean).slice(-2);
                return segments.some(function(segment) {
                    const base = segment.replace(/\.(?:ts|m4s|mp4|m4v|aac|m4a|cmfv|cmfa)$/i, '');
                    return /^(?:ad|ads|adv|advert|adverts|adserver|adservice|guanggao|preroll|midroll|postroll)$/i.test(base)
                        || /^(?:ad|ads|adv|advert)[-_]?(?:pre|mid|post)?roll\d*$/i.test(base);
                });
            } catch (error) {
                return false;
            }
        }

        function filterAdsFromM3U8(m3u8Content, strictMode = false) {
            if (!m3u8Content || typeof m3u8Content !== 'string') return m3u8Content || '';

            const lines = m3u8Content.split('\n');
            const filteredLines = [];
            let droppedSegments = 0;
            let keptSegments = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                // 标签行一律保留：删掉 #EXT-X-DISCONTINUITY（或 -SEQUENCE）会让
                // 时间戳跳变失去重同步点，导致缓冲空洞、卡顿和音画不同步。
                if (!trimmed || trimmed.startsWith('#')) {
                    filteredLines.push(line);
                    continue;
                }

                // 只有分片地址明确命中广告特征时才丢弃该分片
                if (isAdSegmentUrl(trimmed)) {
                    // 连带丢弃它前面紧邻的分片描述行（EXTINF / BYTERANGE），
                    // 但绝不碰 EXT-X-KEY / EXT-X-MAP 等影响解码的标签
                    while (filteredLines.length) {
                        const previous = filteredLines[filteredLines.length - 1].trim();
                        if (previous.startsWith('#EXTINF') || previous.startsWith('#EXT-X-BYTERANGE')) {
                            filteredLines.pop();
                            continue;
                        }
                        break;
                    }
                    droppedSegments++;
                    continue;
                }

                keptSegments++;
                filteredLines.push(line);
            }

            // 安全阀：如果筛完一个分片都不剩，说明判断失误，原样返回避免播出空白
            if (keptSegments === 0 && droppedSegments > 0) {
                console.warn('广告过滤后没有剩余分片，已回退为原始播放列表');
                return m3u8Content;
            }

            return filteredLines.join('\n');
        }
        

        // 显示错误
        // options.force = true 时即使已经在播放也显示错误蒙层（用于确实播不下去的情况）
        function showError(message, options = {}) {
            const isPlaying = Boolean(mediaEl && mediaEl.currentTime > 1);

            if (isPlaying && !options.force) {
                // 播放中途的偶发错误：不用整块蒙层打断观看，给个轻提示；
                // 但以前这里是完全静默的，用户只看到画面卡住却什么也不知道
                console.warn('播放中的错误（轻提示）:', message);
                const now = Date.now();
                if (now - lastRecoveryToastAt > 5000) {
                    lastRecoveryToastAt = now;
                    showToast(message, 'error');
                }
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            document.getElementById('error-message').textContent = message;
        }

        // 更新集数信息
        function updateEpisodeInfo() {
            const total = currentEpisodes.length;
            const info = document.getElementById('episodeInfo');
            const summary = document.getElementById('episodePositionSummary');
            const countLabel = document.getElementById('episodeCountLabel');

            if (total > 0) {
                info.textContent = `第 ${currentEpisodeIndex + 1} / ${total} 集`;
                summary.textContent = `共 ${total} 集`;
                countLabel.textContent = `共 ${total} 集`;
            } else {
                info.textContent = '暂无剧集';
                summary.textContent = '当前片源未提供剧集信息';
                countLabel.textContent = '暂无剧集';
            }
        }

        // 更新按钮状态
        function updateButtonStates() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            const previousDisabled = currentEpisodeIndex <= 0;
            prevButton.disabled = previousDisabled;
            prevButton.classList.toggle('is-disabled', previousDisabled);

            const nextDisabled = currentEpisodeIndex >= currentEpisodes.length - 1;
            nextButton.disabled = nextDisabled;
            nextButton.classList.toggle('is-disabled', nextDisabled);
        }

        // 渲染集数按钮
        function renderEpisodes() {
            const episodesList = document.getElementById('episodesList');
            if (!episodesList) return;
            
            if (!currentEpisodes || currentEpisodes.length === 0) {
                episodesList.innerHTML = '<div class="episodes-empty">没有可用的集数</div>';
                document.getElementById('episodeCountLabel').textContent = '暂无剧集';
                return;
            }
            
            const episodes = episodesReversed ? [...currentEpisodes].reverse() : currentEpisodes;
            let html = '';
            
            episodes.forEach((episode, index) => {
                // 根据倒序状态计算真实的剧集索引
                const realIndex = episodesReversed ? currentEpisodes.length - 1 - index : index;
                const isActive = realIndex === currentEpisodeIndex;
                
                html += `
                    <button id="episode-${realIndex}" 
                            onclick="playEpisode(${realIndex})" 
                            class="episode-btn${isActive ? ' episode-active' : ''}"
                            ${isActive ? 'aria-current="true"' : ''}>
                        第${realIndex + 1}集
                    </button>
                `;
            });
            
            episodesList.innerHTML = html;
            document.getElementById('episodeCountLabel').textContent = `共 ${currentEpisodes.length} 集`;
        }

        // 播放指定集数
        async function playEpisode(index, options = {}) {
            const shouldUpdateHistory = options.updateHistory !== false;
            const shouldSaveProgress = options.saveProgress !== false;
            const requestedUrl = options.url || currentEpisodes[index];

            // 确保index在有效范围内
            if (!Number.isInteger(index) || index < 0 || index >= currentEpisodes.length
                || !/^https?:\/\//i.test(requestedUrl || '')) {
                console.error(`无效的剧集索引: ${index}, 当前剧集数量: ${currentEpisodes.length}`);
                showToast(`无效的剧集索引: ${index + 1}，当前剧集总数: ${currentEpisodes.length}`);
                return;
            }
            
            // 保存当前播放进度（如果正在播放）
            if (shouldSaveProgress && mediaEl && !videoHasEnded) {
                saveCurrentProgress();
            }
            
            // 清除进度保存计时器
            if (progressSaveInterval) {
                clearInterval(progressSaveInterval);
                progressSaveInterval = null;
            }
            
            // 首先隐藏之前可能显示的错误
            document.getElementById('error').style.display = 'none';
            // 显示加载指示器
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').innerHTML = `
                <div class="loading-spinner"></div>
                <div>正在加载视频...</div>
            `;

            const requestId = ++episodePlaybackRequestId;
            let url = requestedUrl;
            if (isSharePageUrl(requestedUrl)) {
                document.getElementById('loading').innerHTML = `
                    <div class="loading-spinner"></div>
                    <div>正在解析视频地址...</div>
                `;
                try {
                    url = await resolvePlayableVideoUrl(requestedUrl);
                } catch (error) {
                    if (requestId !== episodePlaybackRequestId) return;
                    console.error('解析分享页视频地址失败:', error);
                    showError('无法从该分享页解析出视频地址，请切换其他片源');
                    return;
                }
                if (requestId !== episodePlaybackRequestId) return;
            }

            const playbackPlan = getVideoPlaybackPlan(url);
            if (playbackPlan.unsupported) {
                showError('当前浏览器不支持该视频格式，请切换其他片源');
                return;
            }

            // 取消上一集尚未完成的恢复，避免旧回调影响新剧集
            cancelPlaybackRestore();
            playerTransitionInProgress = true;
            currentEpisodeIndex = index;
            videoHasEnded = false; // 重置视频结束标志
            
            // 获取当前URL参数，保留source参数
            const urlParams = new URLSearchParams(window.location.search);
            const sourceName = urlParams.get('source') || '';
            const sourceCode = urlParams.get('source_code') || '';
            
            // 用户切换剧集时新增一条历史记录；浏览器前进/后退时只同步播放状态
            if (shouldUpdateHistory) {
                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('index', index);
                newUrl.searchParams.set('url', requestedUrl);
                if (sourceName) {
                    newUrl.searchParams.set('source', sourceName);
                }
                if (sourceCode) {
                    newUrl.searchParams.set('source_code', sourceCode);
                }
                window.history.pushState({
                    episodeIndex: index,
                    videoUrl: requestedUrl,
                    playbackPosition: 0
                }, '', newUrl);
            }
            
            // 更新播放器
            if (player) {
                if (options.restorePosition) {
                    restorePlaybackPosition(
                        options.position ?? getSavedPlaybackPosition(currentVideoTitle, index),
                        {
                            index: index,
                            url: requestedUrl,
                            expectedDuration: options.expectedDuration
                        }
                    );
                }

                try {
                    loadPlayerSource(url, playbackPlan);
                } catch (e) {
                    console.error('切换视频出错，尝试重新初始化:', e);
                    initPlayer(url, sourceCode);
                }
            } else {
                if (mediaEl) {
                    try {
                        player.pause();
                    } catch (error) {
                        console.warn('停止旧播放器失败:', error);
                    }
                }
                initPlayer(url, sourceCode);
                if (options.restorePosition) {
                    restorePlaybackPosition(
                        options.position ?? getSavedPlaybackPosition(currentVideoTitle, index),
                        {
                            index: index,
                            url: requestedUrl,
                            expectedDuration: options.expectedDuration
                        }
                    );
                }
            }
            
            // 更新UI
            updateEpisodeInfo();
            updateButtonStates();
            renderEpisodes();

            window.setTimeout(() => {
                playerTransitionInProgress = false;
            }, 1200);
            
            // 三秒后保存到历史记录
            setTimeout(() => saveToHistory(), 3000);
        }

        // 同步浏览器前进/后退与剧集播放状态
        function handleHistoryNavigation() {
            if (!currentEpisodes.length) return;

            saveCurrentProgress({ updateHistoryState: false });

            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('url');
            let index = Number.parseInt(urlParams.get('index') || '0', 10);

            if (!Number.isInteger(index)) {
                index = 0;
            }

            if (!targetUrl) {
                if (index < 0 || index >= currentEpisodes.length) return;
            } else if (index < 0 || index >= currentEpisodes.length || currentEpisodes[index] !== targetUrl) {
                const matchedIndex = currentEpisodes.indexOf(targetUrl);
                if (matchedIndex === -1) {
                    if (index < 0 || index >= currentEpisodes.length || !/^https?:\/\//i.test(targetUrl)) {
                        console.warn('历史记录中的剧集无效，忽略本次导航');
                        return;
                    }
                    currentEpisodes[index] = targetUrl;
                    try {
                        localStorage.setItem('currentEpisodes', JSON.stringify(currentEpisodes));
                    } catch (error) {
                        console.warn('更新历史剧集地址失败:', error);
                    }
                } else {
                    index = matchedIndex;
                }
            }

            const resolvedUrl = targetUrl || currentEpisodes[index];
            if (index === currentEpisodeIndex && resolvedUrl === currentEpisodes[currentEpisodeIndex] && player) {
                updateEpisodeInfo();
                updateButtonStates();
                renderEpisodes();
                return;
            }

            const historyState = window.history.state;
            const statePosition = historyState
                && historyState.episodeIndex === index
                && Number.isFinite(Number(historyState.playbackPosition))
                ? Number(historyState.playbackPosition)
                : null;
            let expectedDuration = historyState
                && historyState.episodeIndex === index
                && Number.isFinite(Number(historyState.duration))
                ? Number(historyState.duration)
                : 0;
            let savedPosition = statePosition > 1 ? statePosition : 0;
            if (!(savedPosition > 1)) {
                const savedProgress = readSavedPlaybackProgress(currentVideoTitle, index);
                if (savedProgress) {
                    savedPosition = savedProgress.position;
                    if (!(expectedDuration > 0)) {
                        expectedDuration = savedProgress.duration;
                    }
                }
            }
            playEpisode(index, {
                url: resolvedUrl,
                updateHistory: false,
                saveProgress: false,
                restorePosition: true,
                position: savedPosition,
                expectedDuration: expectedDuration
            });
        }

        // 播放上一集
        function playPreviousEpisode() {
            if (currentEpisodeIndex > 0) {
                playEpisode(currentEpisodeIndex - 1);
            }
        }

        // 播放下一集
        function playNextEpisode() {
            if (currentEpisodeIndex < currentEpisodes.length - 1) {
                playEpisode(currentEpisodeIndex + 1);
            }
        }

        // 切换集数排序
        function toggleEpisodeOrder() {
            episodesReversed = !episodesReversed;
            
            // 保存到localStorage
            localStorage.setItem('episodesReversed', episodesReversed);
            
            // 重新渲染集数列表
            renderEpisodes();
            
            // 更新排序按钮

        // 更新排序按钮状态
        function updateOrderButton() {
            const orderText = document.getElementById('orderText');
            const orderIcon = document.getElementById('orderIcon');
            
            if (orderText && orderIcon) {
                orderText.textContent = episodesReversed ? '正序排列' : '倒序排列';
                orderIcon.style.transform = episodesReversed ? 'rotate(180deg)' : '';

        }

        function resetPlayerQuality() {
            playerQualityState = {
                levels: [],
                selectedLevel: -1,
                activeLevel: -1,
                auto: true,
                current: null
            };
            closeQualityMenu();

            const control = document.getElementById('qualityControl');
            const toggle = document.getElementById('qualityToggle');
            const label = document.getElementById('qualityLabel');
            if (control) control.hidden = true;
            if (label) label.textContent = '自动';
            if (toggle) {
                toggle.classList.remove('is-static');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-disabled', 'false');
                toggle.title = '清晰度';
            }
        }

        function getQualityDimensions(level, video) {
            return {
                width: Number(level && level.width) || Number(video && video.videoWidth) || 0,
                height: Number(level && level.height) || Number(video && video.videoHeight) || 0
            };
        }

        function formatQualityTier(level, video) {
            const { width, height } = getQualityDimensions(level, video);
            if (!width || !height) return '';

            const pixels = width * height;
            const tiers = [
                [3840 * 2160 * 0.8, '4K'],
                [2560 * 1440 * 0.8, '2K'],
                [1920 * 1080 * 0.8, '1080P'],
                [1280 * 720 * 0.8, '720P'],
                [854 * 480 * 0.8, '480P'],
                [640 * 360 * 0.8, '360P']
            ];
            for (const [minimumPixels, label] of tiers) {
                if (pixels >= minimumPixels) return label;
            }
            return `${height}P`;
        }

        function formatQualityBitrate(bitrate) {
            const value = Number(bitrate) || 0;
            if (!value) return '';
            if (value >= 1000000) {
                return `${(value / 1000000).toFixed(1).replace(/\.0$/, '')} Mbps`;
            }
            return `${Math.round(value / 1000)} Kbps`;
        }

        function formatQualityDetails(level, video) {
            if (!level) return '';
            const { width, height } = getQualityDimensions(level, video);
            const parts = [];
            if (width && height) parts.push(`${width}×${height}`);
            const bitrate = formatQualityBitrate(level.bitrate);
            if (bitrate) parts.push(bitrate);
            return parts.join(' · ');
        }

        function getQualityLevelName(level, video, index = -1) {
            if (!level) return '自动';
            return formatQualityTier(level, video)
                || level.name
                || (index >= 0 ? `档位 ${index + 1}` : '自动');
        }

        function getQualityLevels(hls, video) {
            return (hls && Array.isArray(hls.levels) ? hls.levels : []).map((level, index) => {
                const dimensions = getQualityDimensions(level, video);
                return {
                    index,
                    width: dimensions.width,
                    height: dimensions.height,
                    bitrate: Number(level.bitrate) || 0,
                    codecs: level.codecs || '',
                    name: level.name || ''
                };
            });
        }

        function getActiveHlsLevelIndex(hls) {
            if (!hls) return -1;
            if (Number.isInteger(hls.currentLevel) && hls.currentLevel >= 0) return hls.currentLevel;
            if (Number.isInteger(hls.loadLevel) && hls.loadLevel >= 0) return hls.loadLevel;
            if (Number.isInteger(hls.nextLevel) && hls.nextLevel >= 0) return hls.nextLevel;
            return -1;
        }

        function syncPlayerQuality(hls, video) {
            if (!hls || hls !== currentHls) return;

            const levels = getQualityLevels(hls, video);
            const manualLevel = Number.isInteger(hls.manualLevel) ? hls.manualLevel : -1;
            const auto = manualLevel < 0;
            const selectedLevel = auto ? -1 : manualLevel;
            const activeLevel = getActiveHlsLevelIndex(hls);

            playerQualityState = {
                levels,
                selectedLevel,
                activeLevel,
                auto,
                current: levels[activeLevel] || levels[0] || null
            };
            renderQualityControl(video);
        }

        function renderQualityControl(video) {
            const control = document.getElementById('qualityControl');
            const toggle = document.getElementById('qualityToggle');
            const label = document.getElementById('qualityLabel');
            if (!control || !toggle || !label) return;

            const { levels, activeLevel, selectedLevel, auto } = playerQualityState;
            if (levels.length === 0) {
                control.hidden = true;
                closeQualityMenu();
                return;
            }

            control.hidden = false;
            const singleLevel = levels.length <= 1;
            const active = levels[activeLevel] || levels[0] || null;
            const activeName = getQualityLevelName(active, video, activeLevel);
            const activeDetails = formatQualityDetails(active, video);

            toggle.classList.toggle('is-static', singleLevel);
            toggle.setAttribute('aria-disabled', String(singleLevel));

            if (singleLevel) {
                label.textContent = activeName;
                toggle.title = activeDetails
                    ? `当前清晰度：${activeDetails}（单一档位）`
                    : '当前片源只有一个清晰度档位';
                closeQualityMenu();
                return;
            }

            if (auto) {
                label.textContent = activeName === '自动' ? '自动' : `自动 · ${activeName}`;
            } else {
                const selected = levels[selectedLevel] || active;
                label.textContent = getQualityLevelName(selected, video, selectedLevel);
            }
            toggle.title = activeDetails
                ? `当前清晰度：${activeDetails}`
                : '切换清晰度';

            renderQualityMenu(video);
        }

        function createQualityOption(index, name, meta, isActive) {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'quality-option';
            option.setAttribute('role', 'option');
            option.setAttribute('aria-selected', String(isActive));
            if (isActive) option.classList.add('is-active');

            const nameElement = document.createElement('span');
            nameElement.className = 'quality-option-name';
            nameElement.textContent = name;

            const metaElement = document.createElement('span');
            metaElement.className = 'quality-option-meta';
            metaElement.textContent = meta;

            const stateElement = document.createElement('span');
            stateElement.className = 'quality-option-state';
            stateElement.textContent = isActive ? '当前' : '';

            option.append(nameElement, metaElement, stateElement);
            option.addEventListener('click', function(event) {
                event.stopPropagation();
                selectQualityLevel(index);
            });
            return option;
        }

        function renderQualityMenu(video) {
            const menu = document.getElementById('qualityMenu');
            if (!menu || !qualityMenuOpen) return;

            const { levels, activeLevel, selectedLevel, auto } = playerQualityState;
            const active = levels[activeLevel] || levels[0] || null;
            const activeDetails = formatQualityDetails(active, video);
            menu.replaceChildren();

            menu.appendChild(createQualityOption(
                -1,
                '自动',
                activeDetails ? `当前 ${activeDetails}` : '根据当前网络自动选择',
                auto
            ));

            levels.forEach((level, index) => {
                const details = formatQualityDetails(level, video);
                menu.appendChild(createQualityOption(
                    index,
                    getQualityLevelName(level, video, index),
                    details || `档位 ${index + 1}`,
                    !auto && selectedLevel === index
                ));
            });
        }

        function toggleQualityMenu(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (playerQualityState.levels.length <= 1) return;
            if (qualityMenuOpen) {
                closeQualityMenu(true);
            } else {
                openQualityMenu();
            }
        }

        function openQualityMenu() {
            const menu = document.getElementById('qualityMenu');
            const toggle = document.getElementById('qualityToggle');
            if (!menu || !toggle) return;

            qualityMenuOpen = true;
            menu.hidden = false;
            toggle.setAttribute('aria-expanded', 'true');
            renderQualityMenu(mediaEl);

            if (!menu.dataset.keyboardBound) {
                menu.dataset.keyboardBound = 'true';
                menu.addEventListener('keydown', function(event) {
                    const options = [...menu.querySelectorAll('.quality-option')];
                    const currentIndex = options.indexOf(document.activeElement);
                    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                        event.preventDefault();
                        const direction = event.key === 'ArrowDown' ? 1 : -1;
                        const nextIndex = currentIndex < 0
                            ? 0
                            : (currentIndex + direction + options.length) % options.length;
                        options[nextIndex]?.focus();
                    } else if (event.key === 'Home' || event.key === 'End') {
                        event.preventDefault();
                        options[event.key === 'Home' ? 0 : options.length - 1]?.focus();
                    }
                });
            }

            requestAnimationFrame(() => {
                const activeOption = menu.querySelector('.quality-option.is-active')
                    || menu.querySelector('.quality-option');
                activeOption?.focus();
            });
        }

        function closeQualityMenu(restoreFocus = false) {
            const menu = document.getElementById('qualityMenu');
            const toggle = document.getElementById('qualityToggle');
            qualityMenuOpen = false;
            if (menu) menu.hidden = true;
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
            if (restoreFocus && toggle && !toggle.classList.contains('is-static')) {

        function selectQualityLevel(levelIndex) {

            if (levelIndex < 0) {
                currentHls.currentLevel = -1;

                currentHls.currentLevel = levelIndex;

        function getPlaybackQualityInfo() {
            const { levels, selectedLevel, activeLevel, auto, current } = playerQualityState;
            return {
                auto,
                selectedLevel,

            };

        // 在播放器初始化后添加视频到历史记录
        function saveToHistory() {
            // 确保 currentEpisodes 非空
            if (!currentEpisodes || currentEpisodes.length === 0) {
                console.warn('没有可用的剧集列表，无法保存完整的历史记录');
            }
            
            // 尝试从URL中获取参数
            const urlParams = new URLSearchParams(window.location.search);
            const sourceName = urlParams.get('source') || '';
            const sourceCode = urlParams.get('source_code') || '';

            // 获取当前播放进度
            let currentPosition = 0;
            let videoDuration = 0;
            
            if (mediaEl) {
                currentPosition = mediaEl.currentTime;
                videoDuration = mediaEl.duration;
            }

            // 构建要保存的视频信息对象
            const videoInfo = {
                title: currentVideoTitle,
                // 创建基础URL，使用标题作为唯一标识符
                url: `player.html?title=${encodeURIComponent(currentVideoTitle)}&source=${encodeURIComponent(sourceName)}&source_code=${encodeURIComponent(sourceCode)}`,
                episodeIndex: currentEpisodeIndex,
                sourceName: sourceName,
                sourceCode: sourceCode,
                timestamp: Date.now(),
                // 添加播放进度信息
                playbackPosition: currentPosition > 10 ? currentPosition : 0,
                duration: videoDuration,
                // 重要：保存完整的集数列表，确保进行深拷贝
                episodes: currentEpisodes && currentEpisodes.length > 0 ? [...currentEpisodes] : []
            };
            
            // 如果外部定义了addToViewingHistory函数，则调用它
            if (typeof addToViewingHistory === 'function') {
                addToViewingHistory(videoInfo);
                console.log(`已保存 "${currentVideoTitle}" 的历史记录, 集数数据: ${currentEpisodes.length}集`);
            } else {
                // 否则直接使用本地实现
                try {
                    const history = JSON.parse(localStorage.getItem('viewingHistory') || '[]');
                    
                    // 检查是否已经存在相同标题的记录（同一视频的不同集数）
                    const existingIndex = history.findIndex(item => item.title === videoInfo.title);
                    if (existingIndex !== -1) {
                        // 存在则更新现有记录的集数、时间戳和URL
                        history[existingIndex].episodeIndex = currentEpisodeIndex;
                        history[existingIndex].timestamp = Date.now();
                        history[existingIndex].sourceName = sourceName;
                        history[existingIndex].sourceCode = sourceCode || history[existingIndex].sourceCode || '';
                        // 更新播放进度信息
                        history[existingIndex].playbackPosition = currentPosition > 10 ? currentPosition : history[existingIndex].playbackPosition;
                        history[existingIndex].duration = videoDuration || history[existingIndex].duration;
                        // 同时更新URL以保存当前的集数状态
                        history[existingIndex].url = window.location.href;
                        // 更新集数列表（如果有且与当前不同）
                        if (currentEpisodes && currentEpisodes.length > 0) {
                            // 检查是否需要更新集数数据（针对不同长度的集数列表）
                            if (!history[existingIndex].episodes || 
                                !Array.isArray(history[existingIndex].episodes) || 
                                history[existingIndex].episodes.length !== currentEpisodes.length) {
                                history[existingIndex].episodes = [...currentEpisodes]; // 深拷贝
                                console.log(`更新 "${currentVideoTitle}" 的剧集数据: ${currentEpisodes.length}集`);
                            }
                        }
                        
                        // 移到最前面
                        const updatedItem = history.splice(existingIndex, 1)[0];
                        history.unshift(updatedItem);
                    } else {
                        // 添加新记录到最前面，但保存完整URL以便能直接打开到正确的集数
                        videoInfo.url = window.location.href;
                        console.log(`创建新的历史记录: "${currentVideoTitle}", ${currentEpisodes.length}集`);
                        history.unshift(videoInfo);
                    }
                    
                    // 限制历史记录数量为50条
                    if (history.length > 50) history.splice(50);
                    
                    localStorage.setItem('viewingHistory', JSON.stringify(history));
                } catch (e) {
                    console.error('保存观看历史失败:', e);
                }
            }
            renderPlaybackHistory();
        }

        function readPlaybackHistory() {
            try {
                const records = JSON.parse(localStorage.getItem('viewingHistory') || '[]');
                if (!Array.isArray(records)) return [];
                return records
                    .filter(item => item && typeof item.title === 'string' && item.title.trim())
                    .slice(0, 50);
            } catch (error) {
                console.warn('读取播放历史失败:', error);
                return [];
            }
        }

        function formatPlaybackHistoryTime(seconds) {
            const total = Number(seconds);
            if (!Number.isFinite(total) || total <= 0) return '00:00';

            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const remainingSeconds = Math.floor(total % 60);
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function formatPlaybackHistoryDate(timestamp) {
            const time = Number(timestamp);
            if (!Number.isFinite(time) || time <= 0) return '';

            const diff = Math.max(0, Date.now() - time);
            if (diff < 60 * 1000) return '刚刚';
            if (diff < 60 * 60 * 1000) return `${Math.floor(diff / (60 * 1000))} 分钟前`;
            if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / (60 * 60 * 1000))} 小时前`;
            if (diff < 7 * 24 * 60 * 60 * 1000) return `${Math.floor(diff / (24 * 60 * 60 * 1000))} 天前`;

            const date = new Date(time);
            return `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

                const item = document.createElement('article');

                const titleRow = document.createElement('div');

                titleElement.className = 'player-history-title';
                titleElement.textContent = title;
                titleRow.appendChild(titleElement);
                if (isCurrent) {

                    currentLabel.className = 'player-history-current';

                    titleRow.appendChild(currentLabel);

                const meta = document.createElement('div');
                meta.className = 'player-history-meta';
                const episode = document.createElement('span');
                episode.className = 'player-history-episode';
                episode.textContent = `第 ${episodeIndex + 1} 集`;
                meta.appendChild(episode);

                const metaSeparator = document.createElement('span');

                const source = document.createElement('span');

                const recordDate = formatPlaybackHistoryDate(record.timestamp);

                    fill.style.width = `${percent}%`;
                    track.appendChild(fill);
                    const label = document.createElement('div');
                    label.className = 'player-history-progress-label';
                    label.textContent = Number.isFinite(duration) && duration > 0
                        ? `${formatPlaybackHistoryTime(position)} / ${formatPlaybackHistoryTime(duration)}`

        function buildPlaybackHistoryUrl(record) {
            const rawUrl = String(record.url || '').trim();
            if (!rawUrl) return '';

            let target;
            try {
                const candidate = new URL(rawUrl, window.location.href);
                const isPlayerPage = candidate.origin === window.location.origin
                    && /\/player\.html$/i.test(candidate.pathname);

                if (isPlayerPage) {
                    target = candidate;
                } else if (/^https?:\/\//i.test(rawUrl)) {
                    target = new URL('player.html', window.location.origin);
                    target.searchParams.set('url', rawUrl);
                } else {
                    return '';
                }
            } catch (error) {
                console.warn('构建播放历史地址失败:', error);
                return '';
            }

            target.searchParams.set('title', String(record.title || '未知视频'));
            const episodeIndex = Number.isFinite(Number(record.episodeIndex))
                ? Math.max(0, Number(record.episodeIndex))
                : 0;
            target.searchParams.set('index', String(episodeIndex));

            if (record.sourceName) {
                target.searchParams.set('source', String(record.sourceName));
            }
            if (record.sourceCode) {
                target.searchParams.set('source_code', String(record.sourceCode));
            }
            if (Array.isArray(record.episodes) && record.episodes.length > 0) {
                target.searchParams.set('episodes', JSON.stringify(record.episodes));
            }

            target.searchParams.delete('position');
            const position = Number(record.playbackPosition);
            const duration = Number(record.duration);
            const nearEnd = Number.isFinite(duration) && duration > 0 && position >= duration * 0.95;
            if (Number.isFinite(position) && position > 10 && !nearEnd) {
                target.searchParams.set('position', String(Math.floor(position)));
            }

            return target.href;
        }

        function openPlaybackHistoryEntry(record) {
            const targetUrl = buildPlaybackHistoryUrl(record);
            if (!targetUrl) {
                showToast('该历史记录缺少有效的播放地址', 'error');
                return;
            }

            const episodeIndex = Number.isFinite(Number(record.episodeIndex))
                ? Math.max(0, Number(record.episodeIndex))
                : 0;
            if (record.title === currentVideoTitle && episodeIndex === currentEpisodeIndex) {
                closePlaybackHistory();
                showToast('正在播放该内容', 'success');
                return;

            saveCurrentProgress({ updateHistoryState: false });
            closePlaybackHistory({ restoreFocus: false });
            window.location.href = targetUrl;
        }

        function deletePlaybackHistoryEntry(record) {
            try {
                const records = readPlaybackHistory();
                const recordIndex = records.findIndex(item =>
                    item.title === record.title
                    && Number(item.episodeIndex || 0) === Number(record.episodeIndex || 0)
                    && Number(item.timestamp || 0) === Number(record.timestamp || 0)
                );
                if (recordIndex === -1) return;

                records.splice(recordIndex, 1);
                localStorage.setItem('viewingHistory', JSON.stringify(records));
                renderPlaybackHistory();
                showToast('已删除该播放记录', 'success');
            } catch (error) {
                console.error('删除播放历史失败:', error);
                showToast('删除播放记录失败', 'error');

                showToast('播放历史已清空', 'success');

        // 格式化时间为 mm:ss 格式
        function formatTime(seconds) {

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);

        // 开始定期保存播放进度

        // 保存当前播放进度
        function updateCurrentHistoryState(currentTime, duration, videoUrl) {
            const safeTime = Number(currentTime);
            const safeDuration = Number(duration);
            const nextState = {
                ...(window.history.state || {}),
                episodeIndex: currentEpisodeIndex,
                videoUrl: videoUrl || currentEpisodes[currentEpisodeIndex] || '',
                playbackPosition: Number.isFinite(safeTime) && safeTime > 0 ? safeTime : 0
            };
            if (Number.isFinite(safeDuration) && safeDuration > 0) {
                nextState.duration = safeDuration;
            }
            window.history.replaceState(nextState, '', window.location.href);
        }

        function readSavedPlaybackProgress(title, index) {
            try {
                const key = `videoProgress_${encodeURIComponent(title)}_${index}`;
                const saved = JSON.parse(localStorage.getItem(key) || 'null');
                const position = Number(saved && saved.position);
                const duration = Number(saved && saved.duration);
                if (!Number.isFinite(position) || position < 1) return null;
                if (Number.isFinite(duration) && duration > 0 && position >= duration - 1) {
                    return null;
                }
                return {
                    position: position,
                    duration: Number.isFinite(duration) && duration > 0 ? duration : 0,
                    sourceCode: saved && typeof saved.sourceCode === 'string' ? saved.sourceCode : '',
                    timestamp: Number(saved && saved.timestamp) || 0
                };
            } catch (error) {
                console.warn('读取剧集播放进度失败:', error);
                return null;
            }
        }

        function getSavedPlaybackPosition(title, index) {

            return savedProgress ? savedProgress.position : 0;
