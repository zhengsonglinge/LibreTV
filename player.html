        function cancelPlaybackRestore() {
            playbackRestoreToken += 1;
            if (playbackRestoreTimer !== null) {
                clearTimeout(playbackRestoreTimer);
                playbackRestoreTimer = null;
            }
            const cleanup = playbackRestoreCleanup;
            playbackRestoreCleanup = null;
            if (typeof cleanup === 'function') {
                cleanup();
            }
        }

        function restorePlaybackPosition(position, context = {}) {
            const resumePosition = Number(position);
            const targetIndex = Number.isInteger(context.index) ? context.index : currentEpisodeIndex;
            const targetUrl = context.url || currentEpisodes[targetIndex] || '';
            const expectedDuration = Number(context.expectedDuration);
            if (!Number.isFinite(resumePosition) || resumePosition < 1 || !mediaEl) return;

            cancelPlaybackRestore();

            const video = mediaEl;
            const restoreToken = playbackRestoreToken;
            const initialSource = video.currentSrc || video.src || '';
            const startedAt = Date.now();
            let metadataReady = false;
            let positionApplied = false;
            let hintShown = false;
            let attempts = 0;
            let finished = false;

            const isCurrentPlayback = function() {
                return restoreToken === playbackRestoreToken
                    && player
                    && mediaEl === video
                    && currentEpisodeIndex === targetIndex
                    && (!targetUrl || currentEpisodes[targetIndex] === targetUrl);
            };

            const cleanup = function() {
                if (finished) return;
                finished = true;
                video.removeEventListener('loadedmetadata', handleMetadata);
                video.removeEventListener('loadeddata', handleMetadata);
                video.removeEventListener('canplay', handleMetadata);
                video.removeEventListener('durationchange', handleMetadata);
                if (playbackRestoreTimer !== null) {
                    clearTimeout(playbackRestoreTimer);
                    playbackRestoreTimer = null;
                }
                if (playbackRestoreCleanup === cleanup) {
                    playbackRestoreCleanup = null;
                }
            };

            const scheduleRestore = function(delay) {
                if (finished) return;
                if (playbackRestoreTimer !== null) {
                    clearTimeout(playbackRestoreTimer);
                }
                playbackRestoreTimer = setTimeout(tryApplyPosition, delay);
            };

            const tryApplyPosition = function() {
                playbackRestoreTimer = null;
                if (finished) return;
                if (!isCurrentPlayback()) {
                    cleanup();
                    return;
                }

                attempts += 1;
                if (attempts > 24 || Date.now() - startedAt > 12000) {
                    cleanup();
                    return;
                }

                const currentSource = video.currentSrc || video.src || '';
                if (!metadataReady && currentSource !== initialSource && video.readyState >= 1) {
                    metadataReady = true;
                }
                if (!metadataReady) {
                    scheduleRestore(250);
                    return;
                }

                const duration = Number(video.duration);
                if (!Number.isFinite(duration) || duration <= 0) {
                    scheduleRestore(400);
                    return;
                }
                if (Number.isFinite(expectedDuration) && expectedDuration > 0) {
                    const durationTolerance = Math.max(30, expectedDuration * 0.05);
                    if (Math.abs(duration - expectedDuration) > durationTolerance) {
                        console.warn('片源时长差异过大，已取消自动续播', {
                            expectedDuration: expectedDuration,
                            currentDuration: duration
                        });
                        cleanup();
                        return;
                    }
                }
                if (resumePosition >= duration - 1) {
                    cleanup();
                    return;
                }
                if (video.readyState < 1) {
                    scheduleRestore(250);
                    return;
                }

                const seekPosition = Math.min(resumePosition, Math.max(0, duration - 0.5));
                if (Math.abs(video.currentTime - seekPosition) <= 2) {
                    if (video.seeking) {
                        scheduleRestore(500);
                    } else {
                        cleanup();
                    }
                    return;
                }

                try {
                    player.currentTime(seekPosition);
                    positionApplied = true;
                    if (!hintShown && seekPosition >= 10) {
                        hintShown = true;
                        showPositionRestoreHint(seekPosition);
                    }
                } catch (error) {
                    console.warn('恢复播放进度失败:', error);
                    cleanup();
                    return;
                }

                if (positionApplied) {
                    scheduleRestore(600);
                }
            };

            const handleMetadata = function() {
                metadataReady = true;
                tryApplyPosition();
            };

            playbackRestoreCleanup = cleanup;
            video.addEventListener('loadedmetadata', handleMetadata);
            video.addEventListener('loadeddata', handleMetadata);
            video.addEventListener('canplay', handleMetadata);
            video.addEventListener('durationchange', handleMetadata);
            scheduleRestore(80);
        }

        function saveCurrentProgress(options = {}) {
            if (playerTransitionInProgress) return;
            if (!mediaEl) return;
            const currentTime = mediaEl.currentTime;
            const duration = mediaEl.duration;
            if (!duration || currentTime < 1) return;

            // 在localStorage中保存进度
            const progressKey = `videoProgress_${getVideoId()}`;
            const progressData = {
                position: currentTime,
                duration: duration,
                sourceCode: currentSourceCode || '',
                timestamp: Date.now()
            };
            try {
                localStorage.setItem(progressKey, JSON.stringify(progressData));
                if (options.updateHistoryState !== false) {
                    updateCurrentHistoryState(currentTime, duration);
                }
                // --- 新增：同步更新 viewingHistory 中的进度 ---
                try {
                    const historyRaw = localStorage.getItem('viewingHistory');
                    if (historyRaw) {
                        const history = JSON.parse(historyRaw);
                        // 用 title + 集数索引唯一标识
                        const idx = history.findIndex(item =>
                            item.title === currentVideoTitle &&
                            (item.episodeIndex === undefined || item.episodeIndex === currentEpisodeIndex)
                        );
                        if (idx !== -1) {
                            // 只在进度有明显变化时才更新，减少写入
                            if (
                                Math.abs((history[idx].playbackPosition || 0) - currentTime) > 2 ||
                                Math.abs((history[idx].duration || 0) - duration) > 2
                            ) {
                                history[idx].playbackPosition = currentTime;
                                history[idx].duration = duration;
                                history[idx].timestamp = Date.now();
                                localStorage.setItem('viewingHistory', JSON.stringify(history));
                            }
                        }
                    }
                } catch (e) {
                    // 忽略 viewingHistory 更新错误
                }
            } catch (e) {
                console.error('保存播放进度失败', e);
            }
        }

        // 设置移动端长按两倍速播放功能
        function setupLongPressSpeedControl() {
            if (!player) return;
            if (!mediaEl) {
                player.ready(setupLongPressSpeedControl);
                return;
            }
            
            const playerElement = document.getElementById('player');
            let longPressTimer = null;
            let originalPlaybackRate = 1.0;
            let isLongPress = false;
            
            // 显示快速提示
            function showSpeedHint(speed) {
                showShortcutHint(`${speed}倍速`, 'right');
            }

            // 禁用右键
            playerElement.oncontextmenu =  () => {
                // 检测是否为移动设备
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // 只在移动设备上禁用右键
                if (isMobile) {
                    return false;
                }
                return true; // 在桌面设备上允许右键菜单
            };
            
            // 触摸开始事件
            playerElement.addEventListener('touchstart', function(e) {
                // 检查视频是否正在播放，如果没有播放则不触发长按功能
                if (mediaEl.paused) {
                    return; // 视频暂停时不触发长按功能
                }
                
                // 保存原始播放速度
                originalPlaybackRate = mediaEl.playbackRate;
                
                // 设置长按计时器
                longPressTimer = setTimeout(() => {
                    // 再次检查视频是否仍在播放
                    if (mediaEl.paused) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                        return;
                    }
                    
                    // 长按超过500ms，设置为3倍速
                    mediaEl.playbackRate = 3.0;
                    isLongPress = true;
                    showSpeedHint(3.0);
                    
                    // 只在确认为长按时阻止默认行为
                    e.preventDefault();
                }, 500);
            }, { passive: false });
            
            // 触摸结束事件
            playerElement.addEventListener('touchend', function(e) {
                // 清除长按计时器
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                
                // 如果是长按状态，恢复原始播放速度
                if (isLongPress) {
                    mediaEl.playbackRate = originalPlaybackRate;
                    isLongPress = false;
                    showSpeedHint(originalPlaybackRate);
                    
                    // 阻止长按后的点击事件
                    e.preventDefault();
                }
                // 如果不是长按，则允许正常的点击事件（暂停/播放）
            });
            
            // 触摸取消事件
            playerElement.addEventListener('touchcancel', function() {
                // 清除长按计时器
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                
                // 如果是长按状态，恢复原始播放速度
                if (isLongPress) {
                    mediaEl.playbackRate = originalPlaybackRate;
                    isLongPress = false;
                }
            });
            
            // 触摸移动事件 - 防止在长按时触发页面滚动
            playerElement.addEventListener('touchmove', function(e) {
                if (isLongPress) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // 视频暂停时取消长按状态
            mediaEl.addEventListener('pause', function() {
                if (isLongPress) {
                    mediaEl.playbackRate = originalPlaybackRate;
                    isLongPress = false;
                }
                
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            });
        }
        
        // 清除视频进度记录
        function clearVideoProgress() {
            const progressKey = `videoProgress_${getVideoId()}`;
            try {
                localStorage.removeItem(progressKey);
                console.log('已清除播放进度记录');
            } catch (e) {
                console.error('清除播放进度记录失败', e);
            }
        }
        
        // 获取视频唯一标识
        function getVideoId() {
            // 使用视频标题和集数索引作为唯一标识
            return `${encodeURIComponent(currentVideoTitle)}_${currentEpisodeIndex}`;
        }

        // 简单的Toast消息提示函数
        function showToast(message, type = 'error') {
            // 如果已有Toast，先移除它
            const existingToast = document.getElementById('custom-toast');
            if (existingToast) {
                document.body.removeChild(existingToast);
            }
            
            // 创建新的Toast元素
            const toast = document.createElement('div');
            toast.id = 'custom-toast';
            
            // 设置Toast样式
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = type === 'error' ? '#f44336' : '#4caf50';
            toast.style.color = 'white';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '4px';
            toast.style.zIndex = '10000';
            toast.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.3)';
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s ease-in-out';
            
            // 设置Toast内容
            toast.textContent = message;
            
            // 添加到页面
            document.body.appendChild(toast);
            
            // 显示Toast
            setTimeout(() => {
                toast.style.opacity = '1';
                
                // 3秒后隐藏并移除
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => {
                        if (toast.parentNode) {
                            document.body.removeChild(toast);
                        }
                    }, 300);
                }, 3000);
            }, 10);
        }

        let controlsLocked = false;
        function toggleControlsLock() {
            const container = document.getElementById('playerContainer');
            controlsLocked = !controlsLocked;
            container.classList.toggle('controls-locked', controlsLocked);
            const icon = document.getElementById('lockIcon');
            // 切换图标：锁 / 解锁
            icon.innerHTML = controlsLocked
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d=\"M12 15v2m0-8V7a4 4 0 00-8 0v2m8 0H4v8h16v-8h-4z\"/>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d=\"M15 11V7a3 3 0 00-6 0v4m-3 4h12v6H6v-6z\"/>';
        }
    </script>
</body>
