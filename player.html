<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="image/logo.svg" type="image/svg+xml">
    <link rel="icon" href="image/logo-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="image/logo-192.png" sizes="192x192">

    <link rel="stylesheet" href="css/tailwind.css?v=20261112sources1">
    <link rel="stylesheet" href="css/styles.css?v=20261113sourcenetwork2">
    <link rel="stylesheet" href="libs/video-js.min.css?v=20251113videojs1">
    <link rel="stylesheet" href="css/player.css?v=20251113videojs1">
</head>
<body class="player-page">
    <header class="player-header">
        <div class="player-shell player-header-inner">
            <div class="player-header-leading">
                <a href="/" class="player-back" aria-label="返回首页">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m15 18-6-6 6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span>返回首页</span>
                </a>
                <a href="/" class="player-brand" aria-label="网站首页">
                    <img src="image/logo.svg" alt="">
                </a>
            </div>
            <div class="player-heading">
                <span class="player-kicker">正在播放</span>
                <h1 id="videoTitle" class="player-title custom-title-scroll"></h1>
            </div>
            <button id="playbackHistoryToggle" class="player-history-trigger" type="button"
                    aria-label="播放历史" aria-controls="playbackHistoryDrawer" aria-expanded="false"
                    onclick="togglePlaybackHistory(event)">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>播放历史</span>
                <span id="playbackHistoryBadge" class="player-history-badge" hidden>0</span>
            </button>
        </div>
    </header>

    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="player-modal">
        <div class="player-modal-panel">
            <div>
                <h2>访问验证</h2>
                <p>请输入播放密码后继续。</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" placeholder="输入密码" autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit">继续播放</button>
                </form>
                <p id="passwordError" class="player-modal-error hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <div id="playbackHistoryBackdrop" class="player-history-backdrop"
         aria-hidden="true" onclick="closePlaybackHistory()"></div>
    <aside id="playbackHistoryDrawer" class="player-history-drawer"
           aria-labelledby="playbackHistoryHeading" aria-hidden="true" inert>
        <div class="player-history-drawer-header">
            <div>
                <span class="player-kicker">History</span>
                <h2 id="playbackHistoryHeading" class="player-history-drawer-title">播放历史</h2>
            </div>
            <button type="button" class="player-history-close" aria-label="关闭播放历史"
                    onclick="closePlaybackHistory()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                          d="M6 6l12 12M18 6L6 18"></path>
                </svg>
            </button>
        </div>
        <div class="player-history-toolbar">
            <span id="playbackHistoryCount">0 条记录</span>
            <button type="button" onclick="clearPlaybackHistory()">清空历史</button>
        </div>
        <div id="playbackHistoryList" class="player-history-list" aria-live="polite">
            <div class="player-history-empty">正在读取播放历史…</div>
        </div>
        <div class="player-history-footer">播放记录仅保存在当前浏览器，最多保留 50 条</div>
    </aside>

    <main class="player-main">
        <div class="player-shell">
            <section class="player-watch" aria-label="视频播放">
                <div id="playerContainer" class="player-container">
                <video id="player" class="video-js vjs-default-skin vjs-big-play-centered" playsinline webkit-playsinline preload="auto"></video>
                <div class="loading-container" id="loading">
                    <div class="loading-spinner"></div>
                    <div>正在连接片源</div>
                </div>
                <div class="error-container" id="error">
                    <div class="error-icon">!</div>
                    <div id="error-message">视频加载失败</div>
                    <div class="error-help">可以切换片源，或检查当前网络后重试</div>
                </div>
                </div>

                <div class="player-console">
                    <div class="player-controls">
                        <button onclick="playPreviousEpisode()" id="prevButton" class="player-nav-button" aria-label="上一集">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 19l-7-7 7-7"></path>
                            </svg>
                            <span>上一集</span>
                        </button>
                        <div class="episode-position">
                            <span id="episodeInfo">加载中...</span>
                            <span class="episode-position-divider" aria-hidden="true"></span>
                            <span id="episodePositionSummary">正在读取剧集</span>
                        </div>
                        <button onclick="playNextEpisode()" id="nextButton" class="player-nav-button" aria-label="下一集">
                            <span>下一集</span>
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="player-options-bar">
                        <label class="autoplay-control">
                            <span>自动连播</span>
                            <span class="switch">
                                <input type="checkbox" id="autoplayToggle">
                                <span class="slider"></span>
                            </span>
                        </label>
                        <div class="player-option-actions">
                            <div id="qualityControl" class="quality-control" hidden>
                                <button id="qualityToggle" type="button" class="player-tool-button quality-toggle"
                                        aria-haspopup="listbox" aria-expanded="false"
                                        aria-controls="qualityMenu" aria-label="清晰度" title="清晰度"
                                        onclick="toggleQualityMenu(event)">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                                              d="M5 18v-4m5 4V9m5 9V6m5 12v-7" />
                                    </svg>
                                    <span id="qualityLabel" class="quality-label">自动</span>
                                </button>
                                <div id="qualityMenu" class="quality-menu" role="listbox"
                                     aria-label="选择清晰度" hidden></div>
                            </div>
                            <button onclick="toggleEpisodeOrder()" class="player-tool-button">
                                <svg xmlns="http://www.w3.org/2000/svg" id="orderIcon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd" />
                                </svg>
                                <span id="orderText">倒序排列</span>
                            </button>
                            <button id="lockToggle" onclick="toggleControlsLock()" title="锁定控制" aria-label="锁定播放器控制" class="player-icon-button">
                                <svg id="lockIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M15 11V7a3 3 0 00-6 0v4m-3 4h12v6H6v-6z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="player-library-section" aria-label="播放内容">
                <div class="player-library-header">
                    <div class="player-library-heading">
                        <span class="player-kicker">Episodes</span>
                        <h2 id="episodesHeading" class="player-library-title">选集</h2>
                    </div>
                    <span id="episodeCountLabel" class="player-library-tab-meta">正在读取剧集</span>
                </div>

                <div id="episodesPanel" class="player-library-panel" aria-labelledby="episodesHeading">
                    <div class="episode-grid" id="episodesGrid">
                        <div class="episodes-list" id="episodesList">
                            <div class="episodes-empty">正在加载剧集...</div>
                        </div>
                    </div>

                    <div class="player-library-header source-library-header">
                        <div class="player-library-heading">
                            <span class="player-kicker">Sources</span>
                            <h2 id="sourcesHeading" class="player-library-title">片源</h2>
                        </div>
                        <span id="sourceCountLabel" class="player-library-tab-meta">正在读取</span>
                    </div>

                    <div id="sourceSwitchPanel" class="source-switch-panel" aria-labelledby="sourcesHeading">
                        <div id="sourceSwitchList" class="source-switch-list" aria-live="polite">
                            <div class="source-switch-loading">
                                <div class="loading-spinner"></div>
                                <span>正在搜索可用片源…</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 添加快捷键提示元素 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js?v=20261112sources1"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>
    
    <script src="libs/hls.min.js?v=20261112sources1" crossorigin="anonymous"></script>
    <script src="libs/video.min.js?v=20251113videojs1" crossorigin="anonymous"></script>

    <script src="js/config.js?v=20261113bfzydirect1"></script>
    <script src="js/password.js?v=20261112sources1"></script>
    <script src="js/api.js?v=20261112sourceswitch1"></script>

    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};
        
        // 注入服务器端环境变量 (将由服务器端替换)
        // PASSWORD 变量将在这里被服务器端注入
        window.__ENV__.PASSWORD = "{{PASSWORD}}";

        // =================================
        // ============== PLAYER ==========
        // =================================
        // 全局变量
        let currentVideoTitle = '';
        let currentEpisodeIndex = 0;
        let currentEpisodes = [];
        let episodesReversed = false;
        let currentSourceCode = '';
        let currentSourceName = '';
        let sourceOptionsCache = { key: '', items: null };
        let playerSourceCandidateSnapshot = null;
        const selectedSourceIds = new Set();
        const SELECTED_SOURCE_HISTORY_PREFIX = 'libreTVSelectedPlayerSources:';
        const SOURCE_SWITCH_TIMEOUT = 8000;
        const SOURCE_SWITCH_MIN_SCORE = 0.55;
        let sourceSwitchRequestId = 0;
        let sourceSwitchActionInProgress = false;
        let sourceSwitchListState = {
            items: [],
            sources: [],
            loading: false,
            completed: false,
            errors: 0,
            total: 0,
            loadingCount: 0
        };
        let player = null;                     // Video.js 实例
        let mediaEl = null;                    // Video.js 底层的原生 <video>
        let currentPlaybackEngine = '';        // 'hls.js' | 'native-hls' | 'native'
        let playerNoticeTimer = null;
        let currentHls = null; // 跟踪当前HLS实例
        let playerQualityState = {
            levels: [],
            selectedLevel: -1,
            activeLevel: -1,
            auto: true,
            current: null
        };
        let qualityMenuOpen = false;
        let autoplayEnabled = true; // 默认开启自动连播
        let isUserSeeking = false; // 跟踪用户是否正在拖动进度条
        let videoHasEnded = false; // 跟踪视频是否已经自然结束
        let shortcutHintTimeout = null; // 用于控制快捷键提示显示时间
        let adFilteringEnabled = true; // 默认开启广告过滤
        let progressSaveInterval = null; // 定期保存进度的计时器
        let lastRecoveryToastAt = 0; // 播放中错误提示的节流时间戳
        let playerTransitionInProgress = false; // 剧集切换期间忽略旧视频的进度事件
        let playbackRestoreToken = 0;
        let playbackRestoreTimer = null;
        let playbackRestoreCleanup = null;
        let episodePlaybackRequestId = 0;
        let playbackHistoryOpen = false;
        const sharePlaybackUrlCache = new Map();
        const DIRECT_MEDIA_PATH_PATTERN = /\.(?:m3u8|mp4|m4v|webm|ogv|ogg|mov|flv|mkv|ts)$/i;

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            // 先检查用户是否已通过密码验证
            if (!isPasswordVerified()) {
                // 隐藏加载提示
                document.getElementById('loading').style.display = 'none';
                return;
            }

            initializePageContent();
        });

        // 监听密码验证成功事件
        document.addEventListener('passwordVerified', () => {
            document.getElementById('loading').style.display = 'flex';

            initializePageContent();
        });

        document.addEventListener('click', function(event) {
            if (!qualityMenuOpen) return;
            const control = document.getElementById('qualityControl');
            if (control && !control.contains(event.target)) {
                closeQualityMenu();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (!qualityMenuOpen || event.key !== 'Escape') return;
            event.preventDefault();
            event.stopImmediatePropagation();
            closeQualityMenu(true);
        });

        document.addEventListener('keydown', function(event) {
            if (!playbackHistoryOpen || event.key !== 'Escape') return;
            event.preventDefault();
            closePlaybackHistory();
        });

        // 初始化页面内容
        async function initializePageContent() {
            // 解析URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const title = urlParams.get('title');
            const sourceCode = urlParams.get('source_code');
            const sourceName = urlParams.get('source');
            let index = parseInt(urlParams.get('index') || '0');
            const episodesList = urlParams.get('episodes'); // 新增：从URL获取集数信息
            const initialPosition = Number.parseInt(urlParams.get('position') || '0', 10) || 0;

            // 从localStorage获取数据
            currentVideoTitle = title || localStorage.getItem('currentVideoTitle') || '未知视频';
            currentEpisodeIndex = index;
            
            // 设置自动连播开关状态
            autoplayEnabled = localStorage.getItem('autoplayEnabled') !== 'false'; // 默认为true
            document.getElementById('autoplayToggle').checked = autoplayEnabled;
            
            // 获取广告过滤设置
            adFilteringEnabled = localStorage.getItem(PLAYER_CONFIG.adFilteringStorage) !== 'false'; // 默认为true
            
            // 监听自动连播开关变化
            document.getElementById('autoplayToggle').addEventListener('change', function(e) {
                autoplayEnabled = e.target.checked;
                localStorage.setItem('autoplayEnabled', autoplayEnabled);
            });
            
            // 优先使用URL传递的集数信息，否则从localStorage获取
            try {
                if (episodesList) {
                    // 如果URL中有集数数据，优先使用它
                    try {
                        currentEpisodes = JSON.parse(episodesList);
                    } catch {
                        currentEpisodes = JSON.parse(decodeURIComponent(episodesList));
                    }
                    console.log('从URL恢复集数信息:', currentEpisodes.length);
                } else {
                    // 否则从localStorage获取
                    currentEpisodes = JSON.parse(localStorage.getItem('currentEpisodes') || '[]');
                    console.log('从localStorage恢复集数信息:', currentEpisodes.length);
                }
                
                // 检查集数索引是否有效，如果无效则调整为0
                if (index < 0 || (currentEpisodes.length > 0 && index >= currentEpisodes.length)) {
                    console.warn(`无效的剧集索引 ${index}，调整为范围内的值`);
                    
                    // 如果索引太大，则使用最大有效索引
                    if (index >= currentEpisodes.length && currentEpisodes.length > 0) {
                        index = currentEpisodes.length - 1;
                    } else {
                        index = 0;
                    }
                    
                    // 更新URL以反映修正后的索引
                    const newUrl = new URL(window.location.href);
                    newUrl.searchParams.set('index', index);
                    window.history.replaceState({}, '', newUrl);
                }
                
                // 更新当前索引为验证过的值
                currentEpisodeIndex = index;
                
                episodesReversed = localStorage.getItem('episodesReversed') === 'true';
            } catch (e) {
                console.error('获取集数信息失败:', e);
                currentEpisodes = [];
                currentEpisodeIndex = 0;
                episodesReversed = false;
            }

            // 设置页面标题
            document.title = currentVideoTitle + ' - 视频播放器';
            document.getElementById('videoTitle').textContent = currentVideoTitle;
            document.getElementById('videoTitle').title = currentVideoTitle;

            const sourceLabel = sourceName
                || (sourceCode && API_SITES[sourceCode]?.name)
                || (sourceCode === 'custom' ? '自定义片源' : '');
            currentSourceCode = sourceCode || '';
            currentSourceName = sourceLabel || '公开片源';
            loadSelectedSourceHistory();
            playerSourceCandidateSnapshot = readPlayerSourceCandidateSnapshot(currentVideoTitle);

            let resumePosition = initialPosition;
            let resumeDuration = 0;
            if (!(resumePosition > 0) && videoUrl) {
                const savedProgress = readSavedPlaybackProgress(currentVideoTitle, currentEpisodeIndex);
                if (savedProgress && savedProgress.position >= 10) {
                    const savedDuration = Number(savedProgress.duration);
                    const nearEnd = Number.isFinite(savedDuration)
                        && savedDuration > 0
                        && savedProgress.position >= savedDuration * 0.95;
                    if (!nearEnd) {
                        resumePosition = savedProgress.position;
                        resumeDuration = Number.isFinite(savedDuration) ? savedDuration : 0;
                    }
                }
            }

            updateCurrentHistoryState(
                resumePosition,
                null,
                videoUrl || currentEpisodes[currentEpisodeIndex] || ''
            );

            // 初始化播放器
            if (videoUrl) {
                let playableVideoUrl = videoUrl;
                if (isSharePageUrl(videoUrl)) {
                    document.getElementById('loading').style.display = 'flex';
                    document.getElementById('loading').innerHTML = `
                        <div class="loading-spinner"></div>
                        <div>正在解析视频地址...</div>
                    `;
                    try {
                        playableVideoUrl = await resolvePlayableVideoUrl(videoUrl);
                    } catch (error) {
                        console.error('解析分享页视频地址失败:', error);
                        showError('无法从该分享页解析出视频地址，请切换其他片源');
                        playableVideoUrl = '';
                    }
                }
                if (playableVideoUrl) {
                    initPlayer(playableVideoUrl, sourceCode);
                }
                
                // 从URL参数或本地上次进度恢复播放位置
                if (resumePosition > 0) {
                    restorePlaybackPosition(resumePosition, {
                        index: currentEpisodeIndex,
                        url: videoUrl,
                        expectedDuration: resumeDuration
                    });
                }
            } else {
                showError('无效的视频链接');
            }

            // 更新集数信息
            updateEpisodeInfo();
            
            // 渲染集数列表
            renderEpisodes();
            renderPlaybackHistory();
            
            // 更新按钮状态
            updateButtonStates();
            
            // 更新排序按钮状态
            updateOrderButton();

            if (videoUrl) {
                openSourceSwitcher();
            }

            // 添加键盘快捷键事件监听
            document.addEventListener('keydown', handleKeyboardShortcuts);

            // 添加浏览器前进/后退监听
            window.addEventListener('popstate', handleHistoryNavigation);

            // 添加页面离开事件监听，保存播放位置
            window.addEventListener('beforeunload', saveCurrentProgress);

            // 新增：页面隐藏（切后台/切标签）时也保存
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    saveCurrentProgress();
                }
            });

            // 新增：视频暂停时也保存
            // 需确保 mediaEl 已初始化
            const waitForVideo = setInterval(() => {
                if (mediaEl) {
                    mediaEl.addEventListener('pause', saveCurrentProgress);

                    // 新增：播放进度变化时节流保存
                    let lastSave = 0;
                    mediaEl.addEventListener('timeupdate', function() {
                        const now = Date.now();
                        if (now - lastSave > 5000) { // 每5秒最多保存一次
                            saveCurrentProgress();
                            lastSave = now;
                        }
                    });

                    clearInterval(waitForVideo);
                }
            }, 200);
        }

        // 获取已保存的自定义片源
        function getStoredCustomApis() {
            try {
                const customApis = JSON.parse(localStorage.getItem('customAPIs') || '[]');
                return Array.isArray(customApis) ? customApis : [];
            } catch (error) {
                console.warn('读取自定义片源失败:', error);
                return [];
            }
        }

        function readPlayerSourceCandidateSnapshot(title) {
            try {
                const cacheConfig = PLAYER_SOURCE_CACHE_CONFIG;
                const rawSnapshot = sessionStorage.getItem(cacheConfig.storageKey);
                if (!rawSnapshot) return null;

                const snapshot = JSON.parse(rawSnapshot);
                if (
                    snapshot.version !== cacheConfig.version ||
                    !Array.isArray(snapshot.items) ||
                    Date.now() - Number(snapshot.timestamp || 0) > cacheConfig.maxAge ||
                    normalizeSwitchTitle(snapshot.title) !== normalizeSwitchTitle(title)
                ) {
                    return null;
                }

                return {
                    title: snapshot.title,
                    timestamp: snapshot.timestamp,
                    items: snapshot.items.filter(item =>
                        item &&
                        typeof item.source_code === 'string' &&
                        item.source_code
                    )
                };
            } catch (error) {
                console.warn('读取主页片源结果失败:', error);
                return null;
            }
        }

        // 将片源标识转换为播放页可用的配置
        function resolveSwitchSource(sourceId, customApis) {
            if (typeof sourceId !== 'string') return null;

            if (sourceId.startsWith('custom_')) {
                const customIndex = Number.parseInt(sourceId.slice('custom_'.length), 10);
                const customApi = customApis[customIndex];
                if (!customApi || customApi.isAdult || !customApi.url) return null;
                return {
                    sourceId,
                    sourceName: customApi.name || `自定义片源 ${customIndex + 1}`,
                    apiUrl: customApi.url,
                    isCustom: true
                };
            }

            const site = API_SITES[sourceId];
            if (!site || site.adult) return null;
            return {
                sourceId,
                sourceName: site.name,
                apiUrl: site.api,
                network: site.network || '',
                isCustom: false
            };
        }

        // 读取设置中的片源；没有有效设置时回退到全部非成人片源
        function getSwitchSources() {
            const customApis = getStoredCustomApis();
            let selectedIds = [];

            try {
                const storedSelection = JSON.parse(localStorage.getItem('selectedAPIs') || '[]');
                if (Array.isArray(storedSelection)) {
                    selectedIds = storedSelection;
                }
            } catch (error) {
                console.warn('读取片源设置失败，将使用全部片源:', error);
            }

            if (selectedIds.length === 0) {
                selectedIds = [
                    ...Object.keys(API_SITES).filter(sourceId => !API_SITES[sourceId].adult),
                    ...customApis.map((_, index) => `custom_${index}`)
                ];
            }

            const seen = new Set();
            const resolvedSources = [];
            selectedIds.forEach(sourceId => {
                const source = resolveSwitchSource(sourceId, customApis);
                if (!source || seen.has(source.sourceId)) return;
                seen.add(source.sourceId);
                resolvedSources.push(source);
            });

            if (currentSourceCode && !seen.has(currentSourceCode)) {
                const currentSource = resolveSwitchSource(currentSourceCode, customApis);
                if (currentSource) {
                    resolvedSources.push(currentSource);
                }
            }

            return resolvedSources;
        }

        function normalizeSwitchTitle(value) {
            return String(value || '')
                .normalize('NFKC')
                .toLocaleLowerCase('zh-CN')
                .replace(/[^\p{L}\p{N}]+/gu, '');
        }

        function getSwitchBigrams(value) {
            if (!value) return [];
            if (value.length === 1) return [value];

            const bigrams = [];
            for (let index = 0; index < value.length - 1; index += 1) {
                bigrams.push(value.slice(index, index + 2));
            }
            return bigrams;
        }

        function calculateSwitchDiceSimilarity(left, right) {
            if (!left || !right) return 0;
            if (left === right) return 1;

            const leftBigrams = getSwitchBigrams(left);
            const rightBigrams = getSwitchBigrams(right);
            if (leftBigrams.length === 0 || rightBigrams.length === 0) return 0;

            const counts = new Map();
            leftBigrams.forEach(bigram => {
                counts.set(bigram, (counts.get(bigram) || 0) + 1);
            });

            let overlap = 0;
            rightBigrams.forEach(bigram => {
                const count = counts.get(bigram) || 0;
                if (count > 0) {
                    overlap += 1;
                    counts.set(bigram, count - 1);
                }
            });

            return (2 * overlap) / (leftBigrams.length + rightBigrams.length);
        }

        function calculateSwitchTitleScore(query, title) {
            const normalizedQuery = normalizeSwitchTitle(query);
            const normalizedTitle = normalizeSwitchTitle(title);
            if (!normalizedQuery || !normalizedTitle) return 0;
            if (normalizedQuery === normalizedTitle) return 1;
            if (normalizedTitle.startsWith(normalizedQuery)) return 0.92;
            if (normalizedTitle.includes(normalizedQuery)) return 0.84;
            if (normalizedQuery.includes(normalizedTitle) && normalizedTitle.length >= 2) {
                return 0.76;
            }
            return calculateSwitchDiceSimilarity(normalizedQuery, normalizedTitle) * 0.7;
        }

        async function fetchSourceSwitchJson(url) {
            const controller = new AbortController();
            let timeoutId = null;

            const request = fetch(url, { signal: controller.signal })
                .then(async response => {
                    if (!response.ok) {
                        throw new Error(`请求失败（HTTP ${response.status}）`);
                    }
                    const data = await response.json();
                    if (data && typeof data.code === 'number' && data.code >= 400) {
                        throw new Error(data.msg || '片源返回错误');
                    }
                    return data || {};
                });

            const timeout = new Promise((_, reject) => {
                timeoutId = setTimeout(() => {
                    controller.abort();
                    reject(new Error('片源请求超时'));
                }, SOURCE_SWITCH_TIMEOUT);
            });

            try {
                return await Promise.race([request, timeout]);
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function buildSourceSwitchApiParams(source, query, detailId = '') {
            const params = new URLSearchParams();
            if (detailId) {
                params.set('id', detailId);
            } else {
                params.set('wd', query);
            }
            params.set('source', source.isCustom ? 'custom' : source.sourceId);
            if (source.isCustom) {
                params.set('customApi', source.apiUrl);
            }
            return params;
        }

        async function fetchPlayableSourceDetail(source, vodId, requestId) {
            const detailParams = buildSourceSwitchApiParams(source, '', vodId);
            const detailData = await fetchSourceSwitchJson(`/api/detail?${detailParams.toString()}`);
            if (requestId !== sourceSwitchRequestId) return null;

            const episodes = (Array.isArray(detailData.episodes) ? detailData.episodes : [])
                .filter(url => typeof url === 'string' && /^https?:\/\//.test(url));
            if (episodes.length === 0) return null;

            return {
                ...source,
                matchedTitle: detailData.videoInfo?.title || currentVideoTitle,
                score: 1,
                episodes
            };
        }

        async function findPlayableSource(source, requestId) {
            if (playerSourceCandidateSnapshot) {
                const candidate = playerSourceCandidateSnapshot.items
                    .find(item => item.source_code === source.sourceId);
                if (!candidate) return null;

                const cachedEpisodes = (Array.isArray(candidate.episodes) ? candidate.episodes : [])
                    .filter(url => typeof url === 'string' && /^https?:\/\//.test(url));
                if (cachedEpisodes.length > 0) {
                    return {
                        ...source,
                        matchedTitle: candidate.vod_name || currentVideoTitle,
                        score: calculateSwitchTitleScore(currentVideoTitle, candidate.vod_name),
                        episodes: cachedEpisodes
                    };
                }

                if (!candidate.vod_id) return null;
                return fetchPlayableSourceDetail(source, candidate.vod_id, requestId);
            }

            const searchParams = buildSourceSwitchApiParams(source, currentVideoTitle);
            const searchData = await fetchSourceSwitchJson(`/api/search?${searchParams.toString()}`);
            if (requestId !== sourceSwitchRequestId) return null;

            const candidates = (Array.isArray(searchData.list) ? searchData.list : [])
                .map(item => ({
                    item,
                    score: calculateSwitchTitleScore(currentVideoTitle, item.vod_name)
                }))
                .filter(candidate => candidate.score >= SOURCE_SWITCH_MIN_SCORE)
                .sort((left, right) => right.score - left.score);

            if (candidates.length === 0) return null;

            const matched = candidates[0];
            const vodId = String(matched.item.vod_id || '').trim();
            if (!vodId) return null;

            const playableSource = await fetchPlayableSourceDetail(source, vodId, requestId);
            if (!playableSource) return null;
            return {
                ...playableSource,
                matchedTitle: matched.item.vod_name || playableSource.matchedTitle,
                score: matched.score
            };
        }

        function getCurrentSourceSwitchItem() {
            const currentSite = API_SITES[currentSourceCode];
            return {
                sourceId: currentSourceCode || 'current',
                sourceName: currentSourceName || '当前片源',
                network: currentSite ? currentSite.network || '' : '',
                matchedTitle: currentVideoTitle,
                episodes: currentEpisodes,
                isCurrent: true
            };
        }

        function loadSelectedSourceHistory() {
            selectedSourceIds.clear();
            try {
                const stored = JSON.parse(
                    sessionStorage.getItem(`${SELECTED_SOURCE_HISTORY_PREFIX}${currentVideoTitle}`) || '[]'
                );
                if (Array.isArray(stored)) {
                    stored.forEach(sourceId => {
                        if (typeof sourceId === 'string' && sourceId) {
                            selectedSourceIds.add(sourceId);
                        }
                    });
                }
            } catch (error) {
                console.warn('读取已选片源记录失败:', error);
            }
        }

        function rememberSelectedSource(sourceId) {
            if (typeof sourceId !== 'string' || !sourceId) return;
            selectedSourceIds.add(sourceId);

            try {
                sessionStorage.setItem(
                    `${SELECTED_SOURCE_HISTORY_PREFIX}${currentVideoTitle}`,
                    JSON.stringify([...selectedSourceIds])
                );
            } catch (error) {
                console.warn('保存已选片源记录失败:', error);
            }
        }

        function createSourceSwitchItem(item) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'source-switch-item';
            const wasSelected = !item.isCurrent
                && Boolean(item.sourceId)
                && selectedSourceIds.has(item.sourceId);

            if (item.isPending) {
                button.classList.add('is-pending');
                button.disabled = true;
            } else if (item.isCurrent) {
                button.classList.add('is-current');
                button.disabled = true;
                button.setAttribute('aria-current', 'true');
            } else if (wasSelected) {
                button.classList.add('is-used');
                button.title = '已选过，点击可重新切换到此片源';
            }

            const main = document.createElement('span');
            main.className = 'source-switch-item-main';

            const name = document.createElement('span');
            name.className = 'source-switch-name';
            const nameText = document.createElement('span');
            nameText.className = 'source-switch-name-text';
            nameText.textContent = item.sourceName;
            name.appendChild(nameText);

            const meta = document.createElement('span');
            meta.className = 'source-switch-meta';
            const episodeCount = Array.isArray(item.episodes) ? item.episodes.length : 0;
            const networkMeta = SOURCE_NETWORK_META[item.network];
            if (networkMeta) {
                const networkTag = document.createElement('span');
                networkTag.className = `source-network-tag is-${item.network}`;
                networkTag.title = networkMeta.description;
                networkTag.textContent = networkMeta.label;
                meta.append(networkTag, document.createTextNode(' · '));
            }
            if (item.isPending) {
                meta.append('正在检查可用剧集…');
            } else if (item.isCurrent) {
                meta.append(`正在播放 · 共 ${episodeCount} 集`);
            } else if (item.matchedTitle && normalizeSwitchTitle(item.matchedTitle) !== normalizeSwitchTitle(currentVideoTitle)) {
                meta.append(`匹配「${item.matchedTitle}」 · 共 ${episodeCount} 集`);
            } else {
                meta.append(`共 ${episodeCount} 集`);
            }

            const state = document.createElement('span');
            state.className = 'source-switch-state';
            if (item.isPending) {
                state.textContent = '检测中';
                state.classList.add('is-used');
            } else if (item.isCurrent) {
                state.textContent = '✓ 已选择';
            } else if (wasSelected) {
                state.textContent = '已选过';
                state.classList.add('is-used');
            } else {
                state.textContent = '切换';
            }

            main.append(name, meta);
            button.append(main, state);

            if (!item.isCurrent && !item.isPending) {
                button.addEventListener('click', () => switchPlayerSource(item));
            }

            return button;
        }

        function renderSourceSwitchList() {
            const list = document.getElementById('sourceSwitchList');
            const countLabel = document.getElementById('sourceCountLabel');
            if (!list) return;

            const currentItem = getCurrentSourceSwitchItem();
            const orderedSources = Array.isArray(sourceSwitchListState.sources)
                ? sourceSwitchListState.sources
                : [];
            const itemById = new Map(
                sourceSwitchListState.items.map(item => [item.sourceId, item])
            );
            let renderedCount = 0;

            list.replaceChildren();

            if (orderedSources.length > 0) {
                orderedSources.forEach(source => {
                    if (source.sourceId === currentSourceCode) {
                        list.appendChild(createSourceSwitchItem({
                            ...currentItem,
                            sourceOrder: source.sourceOrder
                        }));
                        renderedCount += 1;
                        return;
                    }

                    const loadedItem = itemById.get(source.sourceId);
                    if (loadedItem) {
                        list.appendChild(createSourceSwitchItem({
                            ...loadedItem,
                            isCurrent: false
                        }));
                        renderedCount += 1;
                    } else if (sourceSwitchListState.loading) {
                        list.appendChild(createSourceSwitchItem({
                            sourceId: source.sourceId,
                            sourceName: source.sourceName,
                            isPending: true
                        }));
                        renderedCount += 1;
                    }
                });
            } else {
                list.appendChild(createSourceSwitchItem(currentItem));
                renderedCount += 1;
                sourceSwitchListState.items
                    .filter(item => item.sourceId !== currentSourceCode)
                    .forEach(item => {
                        list.appendChild(createSourceSwitchItem(item));
                        renderedCount += 1;
                    });
            }

            if (sourceSwitchListState.loading) {
                const progress = document.createElement('div');
                progress.className = 'source-switch-progress';
                progress.innerHTML = '<span class="loading-spinner"></span><span>正在检查更多片源…</span>';
                list.appendChild(progress);
            }

            if (!sourceSwitchListState.loading && renderedCount <= 1) {
                const empty = document.createElement('div');
                empty.className = 'source-switch-empty';
                empty.textContent = sourceSwitchListState.errors > 0
                    ? '暂未找到其他可播放片源，请稍后重试'
                    : '暂未找到其他可播放片源';
                list.appendChild(empty);
            }

            if (countLabel) {
                countLabel.textContent = sourceSwitchListState.loading
                    ? '正在检查'
                    : `共 ${renderedCount} 个`;
            }
        }

        async function loadSourceSwitchOptions(requestId, cacheKey, sources) {
            const items = [];
            const orderedSources = sources.map((source, sourceOrder) => ({
                ...source,
                sourceOrder
            }));
            let checked = 0;
            let errors = 0;

            sourceSwitchListState = {
                items,
                sources: orderedSources,
                loading: true,
                completed: false,
                errors,
                total: sources.length,
                loadingCount: sources.length
            };
            renderSourceSwitchList();

            const tasks = orderedSources.map(async (source, sourceOrder) => {
                try {
                    if (source.sourceId === currentSourceCode) {
                        items.push({
                            ...getCurrentSourceSwitchItem(),
                            isCurrent: false,
                            sourceOrder
                        });
                        items.sort((left, right) => left.sourceOrder - right.sourceOrder);
                        return;
                    }

                    const item = await findPlayableSource(source, requestId);
                    if (requestId !== sourceSwitchRequestId) return;
                    if (item) {
                        item.sourceOrder = sourceOrder;
                        items.push(item);
                        items.sort((left, right) =>
                            left.sourceOrder - right.sourceOrder ||
                            left.sourceName.localeCompare(right.sourceName, 'zh-CN')
                        );
                    }
                } catch (error) {
                    if (requestId === sourceSwitchRequestId) {
                        errors += 1;
                        console.warn(`片源 ${source.sourceName} 切换检测失败:`, error);
                    }
                } finally {
                    if (requestId !== sourceSwitchRequestId) return;
                    checked += 1;
                    sourceSwitchListState = {
                        items,
                        sources: orderedSources,
                        loading: true,
                        completed: false,
                        errors,
                        total: sources.length,
                        loadingCount: sources.length - checked
                    };
                    renderSourceSwitchList();
                }
            });

            await Promise.allSettled(tasks);
            if (requestId !== sourceSwitchRequestId) return;

            sourceSwitchListState = {
                items,
                sources: orderedSources,
                loading: false,
                completed: true,
                errors,
                total: sources.length,
                loadingCount: 0
            };
            sourceOptionsCache = {
                key: cacheKey,
                items: [...items],
                sources: [...orderedSources]
            };
            renderSourceSwitchList();
        }

        function openSourceSwitcher() {
            if (!currentVideoTitle || currentVideoTitle === '未知视频') {
                return;
            }

            if (sourceSwitchListState.loading) return;

            const sources = getSwitchSources();
            const cacheKey = JSON.stringify({
                title: currentVideoTitle,
                sources: sources.map(source => `${source.sourceId}:${source.apiUrl}`)
            });

            sourceSwitchRequestId += 1;
            const requestId = sourceSwitchRequestId;

            if (sourceOptionsCache.key === cacheKey && Array.isArray(sourceOptionsCache.items)) {
                sourceSwitchListState = {
                    items: [...sourceOptionsCache.items],
                    sources: Array.isArray(sourceOptionsCache.sources)
                        ? [...sourceOptionsCache.sources]
                        : [],
                    loading: false,
                    completed: true,
                    errors: 0,
                    total: sources.length,
                    loadingCount: 0
                };
                renderSourceSwitchList();
            } else if (sources.length === 0) {
                sourceSwitchListState = {
                    items: [],
                    sources: [],
                    loading: false,
                    completed: true,
                    errors: 0,
                    total: 0,
                    loadingCount: 0
                };
                renderSourceSwitchList();
            } else {
                loadSourceSwitchOptions(requestId, cacheKey, sources);
            }
        }

        function switchPlayerSource(source) {
            if (!source || source.isCurrent || source.sourceId === currentSourceCode || sourceSwitchActionInProgress) {
                return;
            }
            if (!Array.isArray(source.episodes) || source.episodes.length === 0) {
                showToast('该片源暂无可播放剧集', 'error');
                return;
            }

            sourceSwitchActionInProgress = true;
            const switchPosition = mediaEl ? Number(mediaEl.currentTime) : 0;
            const switchDuration = mediaEl ? Number(mediaEl.duration) : 0;
            saveCurrentProgress();

            const nextEpisodes = [...source.episodes];
            const nextIndex = Math.min(currentEpisodeIndex, nextEpisodes.length - 1);
            const restoreSourcePosition = nextIndex === currentEpisodeIndex && switchPosition >= 1;
            rememberSelectedSource(currentSourceCode);
            rememberSelectedSource(source.sourceId);
            currentEpisodes = nextEpisodes;
            currentEpisodeIndex = nextIndex;
            currentSourceCode = source.sourceId;
            currentSourceName = source.sourceName;

            try {
                localStorage.setItem('currentEpisodes', JSON.stringify(currentEpisodes));
                localStorage.setItem('currentEpisodeIndex', String(currentEpisodeIndex));
            } catch (error) {
                console.warn('保存切换后的剧集信息失败:', error);
            }

            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set('url', currentEpisodes[nextIndex]);
            nextUrl.searchParams.set('index', String(nextIndex));
            nextUrl.searchParams.set('source', currentSourceName);
            nextUrl.searchParams.set('source_code', currentSourceCode);
            if (nextUrl.searchParams.has('episodes')) {
                nextUrl.searchParams.set('episodes', JSON.stringify(currentEpisodes));
            }
            window.history.replaceState(window.history.state || {}, '', nextUrl);

            updateEpisodeInfo();
            updateButtonStates();
            renderEpisodes();
            renderSourceSwitchList();
            openSourceSwitcher();
            playEpisode(nextIndex, {
                url: currentEpisodes[nextIndex],
                updateHistory: false,
                saveProgress: false,
                restorePosition: restoreSourcePosition,
                position: switchPosition,
                expectedDuration: switchDuration
            });
            showToast(`已切换到 ${currentSourceName} · 第 ${nextIndex + 1} 集`, 'success');

            window.setTimeout(() => {
                sourceSwitchActionInProgress = false;
            }, 500);
        }

        // 处理键盘快捷键
        function handleKeyboardShortcuts(e) {
            // 忽略输入框中的按键事件
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Alt + 左箭头 = 上一集
            if (e.altKey && e.key === 'ArrowLeft') {
                if (currentEpisodeIndex > 0) {
                    playPreviousEpisode();
                    showShortcutHint('上一集', 'left');
                    e.preventDefault();
                }
            }
            
            // Alt + 右箭头 = 下一集
            if (e.altKey && e.key === 'ArrowRight') {
                if (currentEpisodeIndex < currentEpisodes.length - 1) {
                    playNextEpisode();
                    showShortcutHint('下一集', 'right');
                    e.preventDefault();
                }
            }
        }

        // 显示快捷键提示
        function showShortcutHint(text, direction) {
            const hintElement = document.getElementById('shortcutHint');
            const textElement = document.getElementById('shortcutText');
            const iconElement = document.getElementById('shortcutIcon');
            
            // 清除之前的超时
            if (shortcutHintTimeout) {
                clearTimeout(shortcutHintTimeout);
            }
            
            // 设置文本和图标方向
            textElement.textContent = text;
            
            if (direction === 'left') {
                iconElement.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>';
            } else {
                iconElement.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>';
            }
            
            // 显示提示
            hintElement.classList.add('show');
            
            // 两秒后隐藏
            shortcutHintTimeout = setTimeout(() => {
                hintElement.classList.remove('show');
            }, 2000);
        }

        // 分享页地址解析
        function isSharePageUrl(url) {
            try {
                const parsed = new URL(url);
                return /^https?:$/i.test(parsed.protocol)
                    && !DIRECT_MEDIA_PATH_PATTERN.test(parsed.pathname);
            } catch (error) {
                return false;
            }
        }

        function extractPlayableVideoUrlFromSharePage(html, shareUrl) {
            const normalizedHtml = String(html || '')
                .replace(/\\\//g, '/')
                .replace(/\\u002f/gi, '/')
                .replace(/\\x2f/gi, '/')
                .replace(/\\u0026/gi, '&')
                .replace(/&amp;/gi, '&')
                .replace(/&#0*38;/g, '&')
                .replace(/&#x0*26;/gi, '&');
            const patterns = [
                /\b(?:var|let|const)\s+(?:main|vid|videoUrl|playUrl|sourceUrl|url)\s*=\s*["']([^"']+\.m3u8(?:\?[^"']*)?)["']/i,
                /\b(?:main|vid|videoUrl|playUrl|sourceUrl|url)\s*[:=]\s*["']([^"']+\.m3u8(?:\?[^"']*)?)["']/i,
                /\bsrc\s*=\s*["']([^"']+\.m3u8(?:\?[^"']*)?)["']/i,
                /["']([^"']+\.m3u8(?:\?[^"']*)?)["']/i
            ];

            for (const pattern of patterns) {
                const match = normalizedHtml.match(pattern);
                if (!match || !match[1]) continue;
                try {
                    let candidate = match[1].trim();
                    if (/%2f/i.test(candidate)) {
                        candidate = decodeURIComponent(candidate);
                    }
                    const resolved = new URL(candidate, shareUrl);
                    if (/^https?:$/i.test(resolved.protocol)) {
                        return resolved.href;
                    }
                } catch (error) {
                    console.warn('分享页中的视频地址无效:', match[1]);
                }
            }
            return '';
        }

        function getSharePageProxyUrl(url) {
            const proxyPrefix = typeof PROXY_URL === 'string' ? PROXY_URL : '/proxy/';
            return `${proxyPrefix}${encodeURIComponent(url)}`;
        }

        function discardResponseBody(response) {
            if (response && response.body && !response.bodyUsed) {
                response.body.cancel().catch(() => {});
            }
        }

        async function fetchSharePageResource(url, requiresProxy, signal) {
            const requestUrl = requiresProxy ? getSharePageProxyUrl(url) : url;
            const response = await fetch(requestUrl, {
                credentials: 'omit',
                signal
            });
            if (!response.ok) {
                throw new Error(`分享页请求失败（HTTP ${response.status}）`);
            }

            const contentType = String(response.headers.get('content-type') || '').toLowerCase();
            const isHlsResponse = /mpegurl|x-mpegurl/i.test(contentType);
            if (isHlsResponse) {
                discardResponseBody(response);
                return {
                    kind: 'stream',
                    url: requiresProxy ? requestUrl : (response.url || url)
                };
            }

            const isTextResponse = !contentType
                || /text\/html|application\/xhtml\+xml|text\/plain|application\/json/i.test(contentType);
            if (!isTextResponse) {
                discardResponseBody(response);
                return {
                    kind: 'stream',
                    url: requiresProxy ? requestUrl : (response.url || url)
                };
            }

            const text = await response.text();
            if (text.trimStart().startsWith('#EXTM3U')) {
                return {
                    kind: 'stream',
                    url: requiresProxy ? requestUrl : (response.url || url)
                };
            }
            return {
                kind: 'page',
                text: text
            };
        }

        async function resolvePlayableVideoUrl(url) {
            if (!isSharePageUrl(url)) return url;

            const cached = sharePlaybackUrlCache.get(url);
            if (cached && cached.expiresAt > Date.now()) {
                return cached.url;
            }

            const proxyModes = [false, true];
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            let lastError = null;
            try {
                for (const useProxy of proxyModes) {
                    try {
                        const resource = await fetchSharePageResource(url, useProxy, controller.signal);
                        if (resource.kind === 'stream') {
                            sharePlaybackUrlCache.set(url, {
                                url: resource.url,
                                expiresAt: Date.now() + 5 * 60 * 1000
                            });
                            console.log('分享地址本身为 HLS 流:', resource.url);
                            return resource.url;
                        }

                        const playableUrl = extractPlayableVideoUrlFromSharePage(resource.text, url);
                        if (!playableUrl) {
                            throw new Error('分享页中未找到 m3u8 地址');
                        }
                        sharePlaybackUrlCache.set(url, {
                            url: playableUrl,
                            expiresAt: Date.now() + 5 * 60 * 1000
                        });
                        console.log('已从分享页解析视频地址:', playableUrl);
                        return playableUrl;
                    } catch (error) {
                        lastError = error;
                        if (error && error.name === 'AbortError') break;
                        console.warn(`分享页${useProxy ? '代理' : '直连'}解析失败:`, error);
                    }
                }
                throw lastError || new Error('分享页解析失败');
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function isAppleMobileDevice() {
            const userAgent = navigator.userAgent || '';
            const iPadDesktopMode = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            return /iPad|iPhone|iPod/i.test(userAgent) || iPadDesktopMode;
        }

        function isSafariBrowser() {
            const userAgent = navigator.userAgent || '';
            return /Safari\//i.test(userAgent)
                && !/(?:Chrome|CriOS|Chromium|Edg|EdgiOS|OPR|Firefox|FxiOS)\//i.test(userAgent);
        }

        function supportsNativeHlsPlayback() {
            const video = document.createElement('video');
            return Boolean(
                video.canPlayType('application/vnd.apple.mpegurl')
                || video.canPlayType('application/x-mpegURL')
            );
        }

        function shouldPreferNativeHls() {
            return supportsNativeHlsPlayback() && (isAppleMobileDevice() || isSafariBrowser());
        }

        function isHlsJsSupported() {
            try {
                return typeof Hls !== 'undefined' && Hls.isSupported();
            } catch (error) {
                console.warn('检测 Hls.js 支持失败:', error);
                return false;
            }
        }

        function detectVideoPlaybackKind(url) {
            let decodedUrl = String(url || '');
            try {
                decodedUrl = decodeURIComponent(decodedUrl);
            } catch (error) {
                // 保留原始地址继续判断
            }

            const path = decodedUrl.split(/[?#]/, 1)[0].toLowerCase();
            if (/\.m3u8$/i.test(path)) return 'hls';
            if (/\.(?:mp4|m4v|mov|webm|ogv|ogg)$/i.test(path)) return 'video';
            return 'hls';
        }

        function getVideoPlaybackPlan(url) {
            const kind = detectVideoPlaybackKind(url);
            if (kind === 'video') {
                return { engine: 'native', type: 'normal', unsupported: false };
            }
            if (shouldPreferNativeHls()) {
                return { engine: 'native-hls', type: 'hls', unsupported: false };
            }
            if (isHlsJsSupported()) {
                return { engine: 'hls.js', type: 'hls', unsupported: false };
            }
            if (supportsNativeHlsPlayback()) {
                return { engine: 'native-hls', type: 'hls', unsupported: false };
            }
            return { engine: 'unsupported', type: 'normal', unsupported: true };
        }

        function setPlayerPlaybackEngine(engine) {
            const container = document.getElementById('playerContainer');
            if (container) {
                container.dataset.playbackEngine = engine || '';
            }
        }

        // 根据地址推断给 Video.js 的 MIME（仅用于原生直链）
        function getDirectMediaMimeType(url) {
            let decodedUrl = String(url || '');
            try {
                decodedUrl = decodeURIComponent(decodedUrl);
            } catch (error) {
                // 保留原始地址继续判断
            }
            const path = decodedUrl.split(/[?#]/, 1)[0].toLowerCase();
            if (/\.(?:mp4|m4v|mov)$/.test(path)) return 'video/mp4';
            if (/\.webm$/.test(path)) return 'video/webm';
            if (/\.(?:ogv|ogg)$/.test(path)) return 'video/ogg';
            return 'video/mp4';
        }

        function handleBlockedPlayback(error) {
            if (!error || error.name !== 'NotAllowedError') return false;
            showToast('视频已加载，请点击播放按钮开始播放', 'success');
            return true;
        }

        // 初始化播放器（Video.js）
        function initPlayer(videoUrl, sourceCode) {
            resetPlayerQuality();

            if (!/^https?:\/\//i.test(videoUrl || '')) {
                showError('播放地址无效，请重新选择片源或剧集');
                return;
            }

            const playbackPlan = getVideoPlaybackPlan(videoUrl);
            if (playbackPlan.unsupported) {
                showError('当前浏览器不支持该视频格式，请切换其他片源');
                return;
            }

            if (!player) {
                if (!createVideoPlayer()) return;
                bindPlayerEvents();
                setupLongPressSpeedControl();
            }

            loadPlayerSource(videoUrl, playbackPlan);
        }

        // 创建 Video.js 实例
        function createVideoPlayer() {
            const videoElement = document.getElementById('player');
            if (!videoElement || typeof videojs !== 'function') {
                showError('播放器初始化失败，请刷新页面重试');
                return false;
            }

            player = videojs(videoElement, {
                controls: true,
                // 无操作后隐藏控制条 / 进度条：600ms 触发 + 150ms 淡出，保证 1s 内彻底消失
                inactivityTimeout: 600,
                autoplay: false,
                preload: 'auto',
                loop: false,
                playsinline: true,
                volume: 0.7,
                errorDisplay: false,
                language: 'zh-CN',
                playbackRates: [0.5, 1, 1.25, 1.5, 2],
                controlBar: {
                    pictureInPictureToggle: true,
                    remainingTimeDisplay: true,
                    subsCapsButton: false,
                    audioTrackButton: false
                }
            });

            player.addClass('libretv-player');
            player.volume(0.7);
            mediaEl = getPlayerMediaElement();
            player.ready(function() {
                if (!mediaEl || !mediaEl.parentNode) {
                    mediaEl = getPlayerMediaElement();
                }
            });

            // 把加载/错误蒙层移入播放器内部，全屏时依然可见
            const shell = player.el();
            ['loading', 'error'].forEach(function(id) {
                const layer = document.getElementById(id);
                if (layer && layer.parentNode !== shell) {
                    shell.appendChild(layer);
                }
            });

            return true;
        }

        // 获取原生 video 元素（hls.js / 进度监听都基于它）
        function getPlayerMediaElement() {
            if (!player) return null;
            const tech = player.tech(true);
            return tech && typeof tech.el === 'function' ? tech.el() : null;
        }

        // 加载 / 切换视频源
        function loadPlayerSource(url, playbackPlan) {
            if (!player) return;

            currentPlaybackEngine = playbackPlan.engine || '';
            setPlayerPlaybackEngine(currentPlaybackEngine);
            resetPlayerQuality();

            showLoadingLayer('正在连接片源');
            document.getElementById('error').style.display = 'none';

            try {
                player.src({
                    src: url,
                    type: getVideoJsSourceType(playbackPlan, url)
                });
            } catch (error) {
                console.error('加载视频源失败:', error);
                showError('视频加载失败，请检查视频源或网络连接');
                return;
            }

            if (!isAppleMobileDevice()) {
                const playPromise = player.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(function(error) {
                        if (handleBlockedPlayback(error) || error.name === 'AbortError') return;
                        console.warn('自动播放失败:', error);
                    });
                }
            }
        }

        function getVideoJsSourceType(playbackPlan, url) {
            if (!playbackPlan) return '';
            if (playbackPlan.engine === 'hls.js' || playbackPlan.engine === 'native-hls') {
                return 'application/x-mpegURL';
            }
            return getDirectMediaMimeType(url);
        }

        function showLoadingLayer(message, help) {
            const loading = document.getElementById('loading');
            if (!loading) return;
            loading.style.display = 'flex';
            loading.innerHTML = `
                <div class="loading-spinner"></div>
                <div>${message}</div>
                ${help ? `<div class="error-help">${help}</div>` : ''}
            `;
        }

        // 播放器轻提示（替代 DPlayer 的 notice）
        function showPlayerNotice(message, duration) {
            if (!player) return;
            const shell = player.el();
            let notice = shell.querySelector('.libretv-notice');
            if (!notice) {
                notice = document.createElement('div');
                notice.className = 'libretv-notice';
                shell.appendChild(notice);
            }
            notice.textContent = message;
            notice.classList.add('is-visible');
            if (playerNoticeTimer) clearTimeout(playerNoticeTimer);
            playerNoticeTimer = setTimeout(function() {
                notice.classList.remove('is-visible');
            }, duration || 900);
        }

        function clearPlayerNotice() {
            if (!player) return;
            const notice = player.el().querySelector('.libretv-notice');
            if (notice) {
                notice.textContent = '';
                notice.classList.remove('is-visible');
            }
            if (playerNoticeTimer) {
                clearTimeout(playerNoticeTimer);
                playerNoticeTimer = null;
            }
        }

        // 全屏状态变化
        function handlePlayerFullscreenChange() {
            const isFullscreen = Boolean(player && player.isFullscreen());
            const container = document.getElementById('playerContainer');
            if (container) {
                container.classList.toggle('is-player-fullscreen', isFullscreen);
            }

            if (isFullscreen) {
                if (window.screen.orientation && window.screen.orientation.lock) {
                    window.screen.orientation.lock('landscape')
                        .then(function() {
                            console.log('屏幕已锁定为横向模式');
                        })
                        .catch(function(error) {
                            console.warn('无法锁定屏幕方向，请手动旋转设备:', error);
                        });
                } else {
                    console.warn('当前浏览器不支持锁定屏幕方向，请手动旋转设备。');
                }
            } else if (window.screen.orientation && window.screen.orientation.unlock) {
                window.screen.orientation.unlock();
            }
        }

        // 绑定播放器事件（仅在创建时执行一次）
        function bindPlayerEvents() {
            if (!player) return;

            player.on('fullscreenchange', handlePlayerFullscreenChange);

            player.on('loadedmetadata', function() {
                document.getElementById('loading').style.display = 'none';
                videoHasEnded = false;

                // 视频加载成功后，在稍微延迟后将其添加到观看历史
                setTimeout(saveToHistory, 3000);

                // 启动定期保存播放进度
                startProgressSaveInterval();
            });

            player.on('error', function() {
                if (mediaEl && mediaEl.currentTime > 1) {
                    // 以前这里直接 return，中途出错用户只会看到画面冻住、没有任何提示
                    console.warn('播放中出现媒体错误，已交由 hls.js 恢复逻辑处理');
                    showToast('播放出现异常，正在尝试恢复…', 'error');
                    return;
                }
                showError('视频播放失败，请检查视频源或网络连接');
            });

            // 检测用户是否在拖动进度条
            player.on('seeking', function() {
                isUserSeeking = true;
                videoHasEnded = false;
            });

            player.on('seeked', function() {
                // 如果视频跳转到了非常接近结尾的位置(小于0.3秒)，且不是自然播放到此处
                if (mediaEl && mediaEl.duration > 0) {
                    const timeFromEnd = mediaEl.duration - mediaEl.currentTime;
                    if (timeFromEnd < 0.3 && isUserSeeking) {
                        mediaEl.currentTime = Math.max(0, mediaEl.currentTime - 1);
                    }
                }

                // 延迟重置seeking标志，以便于区分自然播放结束和用户拖拽
                setTimeout(function() {
                    isUserSeeking = false;
                }, 200);
            });

            player.on('ended', function() {
                videoHasEnded = true;

                // 视频已播放完，清除播放进度记录
                clearVideoProgress();

                if (autoplayEnabled && currentEpisodeIndex < currentEpisodes.length - 1) {
                    console.log('视频播放结束，自动播放下一集');
                    setTimeout(function() {
                        if (videoHasEnded && !isUserSeeking) {
                            playNextEpisode();
                            videoHasEnded = false;
                        }
                    }, 1000);
                } else {
                    console.log('视频播放结束，无下一集或未启用自动连播');
                }
            });

            player.on('timeupdate', function() {
                if (player.duration() > 0 && mediaEl) {
                    if (isUserSeeking && mediaEl.currentTime > mediaEl.duration * 0.95) {
                        videoHasEnded = false;
                    }
                }
            });

            // 10秒后如果仍在加载，但不立即显示错误
            setTimeout(function() {
                if (mediaEl && mediaEl.currentTime > 0) {
                    return;
                }

                const loadingEl = document.getElementById('loading');
                if (loadingEl && loadingEl.style.display !== 'none') {
                    showLoadingLayer('视频加载时间较长，请耐心等待', '如长时间无响应，请尝试其他视频源');
                }
            }, 10000);

            setupPlayerHotkeys();
        }

        // 键盘快捷键（空格/方向键/静音/全屏）
        function setupPlayerHotkeys() {
            document.addEventListener('keydown', handlePlayerHotkey);
        }

        function handlePlayerHotkey(event) {
            if (!player || !mediaEl) return;
            if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;

            const target = event.target;
            if (target) {
                if (target.isContentEditable) return;
                if (/^(INPUT|TEXTAREA|SELECT)$/i.test(target.tagName || '')) return;
                if (typeof target.closest === 'function'
                    && target.closest('button, a, [role="listbox"], .quality-menu, .player-modal')) {
                    return;
                }
            }
            if (playbackHistoryOpen) return;

            // 快捷键也算用户活动，顺便把已隐藏的控制条唤回来
            player.userActive(true);
            player.reportUserActivity();

            const key = event.key;
            const step = 5;

            switch (key) {
                case ' ':
                case 'Spacebar':
                case 'k':
                case 'K': {
                    event.preventDefault();
                    const wasPaused = mediaEl.paused;
                    if (wasPaused) {
                        const playPromise = player.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(function() {});
                        }
                        showPlayerNotice('播放', 700);
                    } else {
                        player.pause();
                        showPlayerNotice('暂停', 700);
                    }
                    break;
                }
                case 'ArrowLeft': {
                    event.preventDefault();
                    player.currentTime(Math.max(0, mediaEl.currentTime - step));
                    showPlayerNotice(`快退 ${step} 秒`, 700);
                    break;
                }
                case 'ArrowRight': {
                    event.preventDefault();
                    const maxTime = Number.isFinite(mediaEl.duration)
                        ? mediaEl.duration
                        : mediaEl.currentTime + step;
                    player.currentTime(Math.min(maxTime, mediaEl.currentTime + step));
                    showPlayerNotice(`快进 ${step} 秒`, 700);
                    break;
                }
                case 'ArrowUp': {
                    event.preventDefault();
                    player.volume(Math.min(1, Math.round((mediaEl.volume + 0.1) * 10) / 10));
                    showPlayerNotice(`音量 ${Math.round(mediaEl.volume * 100)}%`, 700);
                    break;
                }
                case 'ArrowDown': {
                    event.preventDefault();
                    player.volume(Math.max(0, Math.round((mediaEl.volume - 0.1) * 10) / 10));
                    showPlayerNotice(`音量 ${Math.round(mediaEl.volume * 100)}%`, 700);
                    break;
                }
                case 'm':
                case 'M': {
                    event.preventDefault();
                    player.muted(!mediaEl.muted);
                    showPlayerNotice(mediaEl.muted ? '静音' : '取消静音', 700);
                    break;
                }
                case 'f':
                case 'F': {
                    event.preventDefault();
                    try {
                        const fsPromise = player.isFullscreen()
                            ? player.exitFullscreen()
                            : player.requestFullscreen();
                        if (fsPromise && typeof fsPromise.catch === 'function') {
                            fsPromise.catch(function(error) {
                                console.warn('切换全屏失败:', error);
                            });
                        }
                    } catch (error) {
                        console.warn('切换全屏失败:', error);
                    }
                    break;
                }
                default:
                    break;
            }
        }

        // 中文文案
        if (typeof videojs !== 'undefined') {
            videojs.addLanguage('zh-cn', {
                'Play': '播放',
                'Pause': '暂停',
                'Mute': '静音',
                'Unmute': '取消静音',
                'Fullscreen': '全屏',
                'Exit Fullscreen': '退出全屏',
                'Non-Fullscreen': '退出全屏',
                'Picture-in-Picture': '画中画',
                'Exit Picture-in-Picture': '退出画中画',
                'Playback Rate': '播放速度',
                'Volume Level': '音量',
                'Current Time': '当前时间',
                'Duration': '时长',
                'Remaining Time': '剩余时间',
                'Progress Bar': '进度条',
                'Loaded': '已加载',
                'Live Window': '直播窗口',
                'Close Modal Dialog': '关闭',
                'Modal Window': '弹窗',
                'This is a modal window': '这是一个弹窗',
                'Beginning of dialog window. Escape will cancel and close the window.':
                    '弹窗开始，按 Esc 可取消并关闭窗口。',
                'End of dialog window.': '弹窗结束。'
            });
        }

        // ===== Video.js × hls.js：接管 m3u8 源 =====
        // 复用项目原有的 hls.js 配置（含广告过滤 Loader），不走 Video.js 内置的 VHS
        const LibreTvHlsSourceHandler = {
            name: 'libretv-hlsjs',
            canPlayType: function(type) {
                if (currentPlaybackEngine !== 'hls.js') return '';
                return /mpegurl/i.test(type || '') ? 'probably' : '';
            },
            canHandleSource: function(source) {
                if (currentPlaybackEngine !== 'hls.js') return '';
                if (!isHlsJsSupported()) return '';
                const src = String((source && source.src) || '');
                const type = String((source && source.type) || '');
                if (/mpegurl/i.test(type)) return 'probably';
                return /\.m3u8(?:[?#]|$)/i.test(src) ? 'probably' : '';
            },
            handleSource: function(source, tech) {
                const video = tech.el();
                const initialUrl = String((source && source.src) || '');

                // 配置HLS.js选项
                const hlsConfig = {
                    debug: false,
                    loader: CustomHlsJsLoader,
                    enableWorker: true,
                    lowLatencyMode: false,
                    // 播放器尺寸小的时候不乱拉高码率：同等带宽下能缓冲更多秒数
                    capLevelToPlayerSize: true,
                    // 清单解析完就并行拉第一个分片，省一次 RTT
                    startFragPrefetch: true,
                    // 历史缓冲只留 30s：长时间观看时 90s 回看缓冲会持续占用内存和解码资源
                    backBufferLength: 30,
                    maxBufferLength: 45,
                    maxMaxBufferLength: 90,
                    // 高码率 1080p/4K 下 30MB 只够十几秒，缓冲会被字节数提前截断
                    maxBufferSize: 80 * 1000 * 1000,
                    // 只容忍 0.2s 以内的缓冲空洞，更大的空洞交给 nudge 跳过而不是卡住等待
                    maxBufferHole: 0.2,
                    nudgeOnVideoHole: true,
                    maxFragLookUpTolerance: 0.5,
                    fragLoadingMaxRetry: 4,
                    // 退避是 min(8s, 1s * 2^n)，累计上限约 15s；
                    // 原来的 64s 会让画面对着一个坏分片干等一分多钟
                    fragLoadingMaxRetryTimeout: 8000,
                    fragLoadingRetryDelay: 1000,
                    manifestLoadingMaxRetry: 3,
                    manifestLoadingRetryDelay: 1000,
                    levelLoadingMaxRetry: 4,
                    levelLoadingRetryDelay: 1000,
                    startLevel: -1,
                    abrEwmaDefaultEstimate: 500000,
                    abrBandWidthFactor: 0.95,
                    // 升档需要约 2 倍带宽余量，避免带宽波动时在相邻码率档来回横跳
                    abrBandWidthUpFactor: 0.5,
                    abrMaxWithRealBitrate: true,
                    stretchShortVideoTrack: true,
                    appendErrorMaxRetry: 5,  // 增加尝试次数
                    liveSyncDurationCount: 3,
