<!DOCTYPE html>

</head>
<body class="page-bg text-white">
    <header class="site-header">
        <div class="site-container site-header-inner">
            <div class="header-leading">
                <a href="#" onclick="resetToHome(); return false;" class="header-brand" aria-label="返回首页">
                    <img src="image/logo.svg" alt="">
                </a>
                <a href="#" onclick="resetToHome(); return false;" class="header-nav-link">发现</a>
            </div>
            <nav class="header-actions" aria-label="快捷操作">
                <button onclick="toggleHistory(event)" class="header-action" aria-label="观看历史">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>观看历史</span>
                </button>
                <button onclick="toggleSettings(event)" class="header-action" aria-label="打开设置">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>设置</span>
                </button>
            </nav>
        </div>
    </header>

    <div id="historyPanel" class="drawer history-panel" aria-label="观看历史" aria-hidden="true">
        <div class="drawer-header">
            <h3 class="drawer-heading">观看历史</h3>
            <button onclick="toggleHistory()" class="drawer-close" aria-label="关闭历史">&times;</button>
        </div>
        <div id="historyList" class="pb-4">
            <!-- 历史记录将在这里动态显示 -->
            <div class="text-center text-gray-500 py-8">暂无观看记录</div>
        </div>
        <div class="history-panel-footer">
            <button onclick="clearViewingHistory()">清空历史记录</button>
        </div>
    </div>

    <div id="settingsPanel" class="drawer settings-panel" aria-label="设置面板" aria-hidden="true">
        <div class="drawer-header">
            <h3 class="drawer-heading">设置</h3>
            <button onclick="toggleSettings()" class="drawer-close" aria-label="关闭设置">&times;</button>
        </div>
        <div>
            <section class="settings-section">
                <label class="settings-section-label">数据源</label>
                <div class="settings-actions">
                    <button onclick="selectAllAPIs(true)" class="settings-mini-button">全选</button>
                    <button onclick="selectAllAPIs(false)" class="settings-mini-button">全不选</button>
                    <button onclick="selectAllAPIs(true, true)" class="settings-mini-button">仅普通资源</button>
                </div>
                <div class="settings-select-all">
                    <div id="apiCheckboxes"></div>
                </div>
                <div class="settings-meta">
                    <span>已选 <span id="selectedApiCount">0</span> 个来源</span>
                    <span id="siteStatus"></span>
                </div>
            </section>

            <section class="settings-section">
                <div class="settings-section-head">
                    <label class="settings-section-label">自定义 API</label>
                    <button onclick="showAddCustomApiForm()" class="settings-mini-button" aria-label="添加自定义 API">＋</button>
                </div>
                <div id="customApisList" class="custom-api-list"></div>
                <div id="addCustomApiForm" class="hidden custom-api-form">
                    <input type="text" id="customApiName" placeholder="API 名称" autocomplete="off">
                    <input type="text" id="customApiUrl" placeholder="https://example.com" autocomplete="off">
                    <div class="flex items-center mb-2">
                        <input type="checkbox" id="customApiIsAdult" class="form-checkbox">
                        <label for="customApiIsAdult" class="ml-2 text-xs text-pink-400">成人资源站</label>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="addCustomApi()" class="settings-mini-button">添加</button>
                        <button onclick="cancelAddCustomApi()" class="settings-mini-button">取消</button>
                    </div>
                </div>
            </section>

            <section class="settings-section">
                <label class="settings-section-label">播放与内容</label>
                <div class="filter-row">
                    <div class="filter-copy">
                        <label>成人内容过滤</label>
                        <p class="filter-description">隐藏相应分类和资源站</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="yellowFilterToggle">
                        <span class="toggle-bg"></span>
                        <span class="toggle-dot"></span>
                    </label>
                </div>
                <div class="filter-row">
                    <div class="filter-copy">
                        <label>分片广告过滤</label>
                        <p>旧设备卡顿时可关闭</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="adFilterToggle">
                        <span class="toggle-bg"></span>
                        <span class="toggle-dot"></span>
                    </label>
                </div>
                <div class="filter-row">
                    <div class="filter-copy">
                        <label>热门推荐</label>
                        <p>在首页显示豆瓣公开榜单</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="doubanToggle">
                        <span class="toggle-bg"></span>
                        <span class="toggle-dot"></span>
                    </label>
                </div>
            </section>

            <section class="settings-section">
                <label class="settings-section-label">本地数据</label>
                <button onclick="clearLocalStorage()" class="settings-wide-button danger">清除页面缓存</button>
            </section>

            <section class="settings-section">
                <label class="settings-section-label">配置</label>
                <button onclick="importConfig()" class="settings-wide-button">导入配置</button>
                <button onclick="exportConfig()" class="settings-wide-button">导出配置</button>
            </section>
        </div>
    </div>

    <main class="site-main">
        <div class="site-container">
            <section id="searchArea" class="search-area">
                <div class="search-intro">
                    <h1 class="search-title">搜索片源</h1>
                    <p class="search-lead">输入片名，从已选来源中查找可播放内容</p>
                </div>
                <div class="search-shell">
                    <div class="search-bar">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="6.5" stroke-width="1.6"></circle>
                            <path d="m16 16 4 4" stroke-width="1.6" stroke-linecap="round"></path>
                        </svg>
                        <input type="text"
                               id="searchInput"
                               class="search-input"
                               placeholder="输入电影、剧集或节目名称"
                               autocomplete="off"
                               aria-label="视频搜索框">
                        <button onclick="search()" class="search-submit" aria-label="搜索">
                            <span>搜索</span>
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12h13M13 6l6 6-6 6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="recentSearches" class="recent-searches" aria-label="最近搜索记录"></div>
                </div>
            </section>

            <section id="doubanArea" class="discover-section hidden">
                <div class="section-header">
                    <div>
                        <p class="section-kicker">豆瓣热门</p>
                        <h2 class="section-title">热门片单</h2>
                        <p class="section-note">选择片名即可检索已选来源</p>
                    </div>
                    <div class="discover-controls">
                        <div class="media-switch" aria-label="内容类型">
                            <button id="douban-movie-toggle" class="is-active">电影</button>
                            <button id="douban-tv-toggle">电视剧</button>
                        </div>
                        <button id="douban-refresh" class="round-button" aria-label="换一批">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 4v5h5M20 20v-5h-5M5.5 9A7.5 7.5 0 0 1 19 12M18.5 15A7.5 7.5 0 0 1 5 12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="douban-tags" class="tag-rail"></div>
                <div id="douban-results" class="douban-grid"></div>
            </section>

            <section id="resultsArea" class="results-section hidden">
                <div class="results-header">
                    <h2 class="results-title">搜索结果</h2>
                    <div class="results-count"><strong id="searchResultsCount">0</strong> 个结果</div>
                </div>
                <div id="searchProgress" class="results-progress" role="progressbar"
                     aria-label="搜索进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
                    <span id="searchProgressFill" class="results-progress-fill"></span>
                </div>
                <div id="results" class="results-grid"></div>
                <div id="resultsFooter" class="results-footer hidden">
                    <p id="searchResultsStatus" class="results-status" aria-live="polite"></p>
                </div>
            </section>
        </div>
    </main>

    <!-- 详情模态框 -->
    <div id="modal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center transition-opacity duration-300 z-40"
         role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-4xl border border-[#333] max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 id="modalTitle" class="text-2xl font-bold gradient-text break-words pr-4 max-w-[80%]"></h2>
                <button onclick="closeModal()" aria-label="关闭详情" class="text-gray-400 hover:text-white text-2xl transition-colors flex-shrink-0">&times;</button>
            </div>
            <div id="modalContent" class="overflow-auto flex-1 min-h-0">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2">
                </div>
            </div>
        </div>
    </div>

    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[65] transition-opacity duration-300">
        <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-md border border-[#333] max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-none">
                <h2 class="text-2xl font-bold gradient-text">访问验证</h2>
            </div>
            <div class="mb-6">
                <p class="text-gray-300 mb-4">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-[#111] border border-[#333] text-white px-4 py-3 rounded-lg focus:outline-none focus:border-white transition-colors" placeholder="密码..." autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">提交</button>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <!-- 错误提示框 -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 -translate-y-full">
        <p id="toastMessage"></p>
    </div>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-[#111] p-8 rounded-lg border border-[#333] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- JSON-LD 结构化数据 -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "免费在线视频搜索与观看",
        "url": "https://video.zhengsongling.com/",
        "description": "免费在线视频搜索与观看平台",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://video.zhengsongling.com/?s={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js?v=20261112sources1"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>
    <script src="js/config.js?v=20261113bfzydirect1"></script>
    <script src="js/ui.js?v=20261113blobguard1"></script>
    <script src="js/api.js?v=20261112sources1"></script>
    <script src="js/password.js?v=20261112sources1"></script>
    <script src="js/app.js?v=20261113blobguard1"></script>
    <script src="js/douban.js?v=20261112doubancache1"></script>

    <!-- PWA 注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js?v=20261112sources1');
            });
        }
    </script>

    <!-- 环境变量注入脚本 -->
    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};
        
        // 注入服务器端环境变量 (将由服务器端替换)
        // PASSWORD 变量将在这里被服务器端注入
        window.__ENV__.PASSWORD = "{{PASSWORD}}";
    </script>

</body>
</html>
